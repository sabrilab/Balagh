      h('p.texte-doux.petit', { text: 'Le CSV est encodé en UTF-8 avec séparateur point-virgule : Excel et LibreOffice l’ouvrent sans réglage.' })),
    actions: [{ libelle: 'Fermer' }],
  });
}

function ouvrirImport(module) {
  const zone = h('textarea.saisie.saisie--code', { rows: 6, placeholder: `${module.champs.slice(0, 3).map((c) => c.libelle).join(';')}\n…` });
  const fichier = champFichier('Choisir un fichier CSV', '.csv,text/csv,text/plain', async (f) => { zone.value = await f.text(); apercu(); });
  const resume = h('p.texte-doux', { text: 'Les colonnes sont reconnues par leur intitulé, dans n’importe quel ordre.' });
  let aInserer = [];
  const apercu = () => {
    const lignes = depuisCSV(zone.value);
    if (lignes.length < 2) { aInserer = []; resume.textContent = 'Collez un fichier CSV avec une ligne d’entêtes puis les données.'; return; }
    const colonnes = correspondance(module, lignes[0]);
    const reconnues = colonnes.filter(Boolean).length;
    aInserer = lignes.slice(1).map((l) => ligneImportee(module, colonnes, l)).filter((l) => l[module.champCle]);
    resume.textContent = `${reconnues} colonnes reconnues sur ${lignes[0].length}, ${aInserer.length} lignes prêtes à être ajoutées à la saison ${saisonActive()}.`;
  };
  zone.addEventListener('input', apercu);
  modale({
    titre: `Importer des ${module.pluriel}`,
    large: true,
    corps: h('div.pile', {},
      h('p.texte-doux', { text: 'Exportez d’abord un fichier depuis ce module pour connaître les colonnes attendues : le format d’export est aussi le format d’import.' }),
      fichier, zone, resume),
    actions: [
      { libelle: 'Annuler' },
      { libelle: 'Importer', variante: 'primaire', action: (fermer) => {
        if (!aInserer.length) { toast('Aucune ligne exploitable dans ce fichier.', 'erreur'); return; }
        ajouterLignes(module.id, aInserer);
        fermer();
        toast(`${aInserer.length} lignes importées.`);
      } },
    ],
  });
}

/* -------------------------------------------------------------------- Vue */

let cadreCourant = null;
let moduleCourant = null;

function rafraichir(moduleId) {
  if (!cadreCourant || moduleCourant !== moduleId) return;
  remplacer(cadreCourant, contenu(MODULE_PAR_ID[moduleId]));
}

function contenu(module) {
  const etat = etatDe(module.id);
  const reglages = reglagesActifs();
  const toutes = lignes(module.id, { toutesSaisons: etat.toutesSaisons });
  const etatsPossibles = [...new Set(toutes.map((l) => module.etat && module.etat(l)).filter(Boolean))];
  const filtrees = toutes.filter((l) => {
    if (etat.filtre && module.etat(l) !== etat.filtre) return false;
    if (!etat.recherche) return true;
    return CHAMPS_TOUS(module).some((c) => contient(c.calcul ? c.calcul(l, reglages) : l[c.id], etat.recherche));
  });

  const recherche = h('input.saisie.saisie--recherche', {
    type: 'search', value: etat.recherche, placeholder: `Rechercher parmi ${toutes.length} ${module.pluriel}…`, 'aria-label': 'Rechercher',
    oninput: (e) => { etat.recherche = e.target.value; rafraichir(module.id); },
  });

  const groupes = module.groupe ? (() => {
    const paniers = new Map();
    for (const l of filtrees) {
      const cle = l[module.groupe.champ] || '—';
      paniers.set(cle, (paniers.get(cle) || 0) + module.groupe.mesure(l, reglages));
    }
    return [...paniers.entries()].map(([libelle, valeur]) => ({ libelle, valeur })).sort((a, b) => b.valeur - a.valeur);
  })() : [];

  return h('div.page', {},
    h('header.page-tete', { style: { '--accent-module': module.couleur } },
      h('div.page-tete-haut', {},
        h('a.lien-retour', { href: '#/', 'aria-label': 'Retour au tableau de bord' }, icone(TRACE_ICONES.retour, 18), h('span', { text: 'Tableau de bord' })),
        h('span.puce-module', {}, icone(module.icone, 18), h('span', { text: module.court }))),
      h('h1.page-titre', { text: module.titre }),
      h('p.page-resume', { text: module.resume })),

    h('div.kpis', {}, module.kpis(lignes(module.id), { reglages, saison: saisonActive() }).map((k) => carteKPI({ ...k, couleur: module.couleur }))),

    h('div.barre-outils', {},
      h('div.barre-outils-gauche', {}, recherche,
        etatsPossibles.length > 1 ? h('select.saisie.saisie--filtre', { 'aria-label': 'Filtrer par état', onchange: (e) => { etat.filtre = e.target.value; rafraichir(module.id); } },
          h('option', { value: '', text: 'Tous les états', selected: !etat.filtre }),
          etatsPossibles.map((s) => h('option', { value: s, text: s, selected: etat.filtre === s }))) : null,
        h('label.bascule', {},
          h('input', { type: 'checkbox', checked: etat.toutesSaisons, onchange: (e) => { etat.toutesSaisons = e.target.checked; rafraichir(module.id); } }),
          h('span', { text: 'Toutes saisons' }))),
      h('div.barre-outils-droite', {},
        bouton('Importer', { icone: TRACE_ICONES.importer, onclick: () => ouvrirImport(module) }),
        bouton('Exporter', { icone: TRACE_ICONES.exporter, onclick: () => menuExport(module, filtrees, reglages) }),
        bouton('Ajouter', { variante: 'primaire', icone: TRACE_ICONES.plus, onclick: () => ouvrirFormulaire(module) }))),

    filtrees.length
      ? h('div.colonnes-module', {},
        carte({ titre: `${nombre(filtrees.length)} ${filtrees.length > 1 ? module.pluriel : module.singulier}`, sousTitre: etat.toutesSaisons ? 'toutes saisons confondues' : `saison ${saisonActive()}`, contenu: tableau(module, filtrees, etat, reglages), classe: 'carte--tableau' }),
        module.groupe && groupes.length ? carte({ titre: module.groupe.titre, contenu: barresHorizontales(groupes, { couleur: module.couleur, format: module.groupe.format }), classe: 'carte--cote' }) : null)
      : carte({ contenu: etatVide({
        titre: toutes.length ? 'Aucun résultat pour cette recherche' : `Aucune donnée pour la saison ${saisonActive()}`,
        detail: toutes.length ? 'Modifiez la recherche ou le filtre d’état.' : `Ajoutez ${module.pluriel} une à une, ou importez un fichier CSV existant.`,
        action: toutes.length ? null : bouton(`Ajouter ${module.singulier}`, { variante: 'primaire', icone: TRACE_ICONES.plus, onclick: () => ouvrirFormulaire(module) }),
      }) }));
}

function vueModule(moduleId) {
  const module = MODULE_PAR_ID[moduleId];
  moduleCourant = moduleId;
  cadreCourant = h('div.cadre-module');
  remplacer(cadreCourant, contenu(module));

}

function quitterModule() {

}

/**
 * Tableau de bord. Le hub radiatif est la porte d'entrée : sept domaines
 * disposés autour de la marque, chacun portant son indicateur clé, pour que
 * l'état du modèle socio-économique se lise avant tout clic.
 *
 * Sous 900 px le cercle devient une grille : sur un téléphone, sept pastilles
 * en rosace seraient trop petites pour être touchées de façon fiable.
 */








/** Positions du hub : sept sommets d'un cercle, le premier au nord. */
function positions(nombreModules, rayon = 37) {
  return Array.from({ length: nombreModules }, (_, i) => {
    const angle = (i / nombreModules) * Math.PI * 2 - Math.PI / 2;
    return { x: 50 + Math.cos(angle) * rayon, y: 50 + Math.sin(angle) * rayon };
  });
}

function hubRadiatif(bilan) {
  const points = positions(MODULES.length);
  const liens = h('svg.hub-liens', { viewBox: '0 0 100 100', 'aria-hidden': 'true', preserveAspectRatio: 'none' });
  points.forEach((p, i) => {
    liens.appendChild(h('line', { x1: 50, y1: 50, x2: p.x, y2: p.y, stroke: MODULES[i].couleur, 'stroke-width': 0.4, 'stroke-dasharray': '1.6 1.6', opacity: 0.55 }));
  });
  liens.appendChild(h('circle', { cx: 50, cy: 50, r: 37, fill: 'none', stroke: 'var(--trait-graphe)', 'stroke-width': 0.3 }));

  const noeuds = MODULES.map((module, i) => {
    const donnees = lignes(module.id);
    return h('a.hub-noeud', {
      href: `#/module/${module.route}`,
      style: { '--x': `${points[i].x}%`, '--y': `${points[i].y}%`, '--couleur-module': module.couleur },
      'aria-label': `${module.titre} — ${module.pastille(donnees)}`,
    },
      h('span.hub-noeud-icone', {}, icone(module.icone, 22)),
      h('span.hub-noeud-titre', { text: module.court }),
      h('span.hub-noeud-valeur', { text: module.pastille(donnees) }));
  });

  return h('div.hub', {},
    liens,
    h('div.hub-centre', {},
      logo(52),
      h('p.hub-centre-nom', { text: reglagesActifs().association }),
      h('p.hub-centre-ligue', { text: reglagesActifs().ligue }),
      h('p.hub-centre-valeur', { text: euros(bilan.produits) }),
      h('p.hub-centre-detail', { text: `produits · ${bilan.saison}` })),
    noeuds);
}

function vueHub() {
  const bilan = synthese();
  const evolution = evolutionProduits();
  const flux = fluxMensuels();
  const segments = bilan.sources.map((s) => ({ libelle: s.module.court, valeur: s.produits, couleur: s.module.couleur }));

  const indicateurs = [
    { libelle: 'Produits de la saison', valeur: euros(bilan.produits), detail: evolution ? `${evolution.ecart >= 0 ? '+' : ''}${evolution.ecart.toFixed(0).replace('-0', '0')} % par rapport à ${saisonPrecedente(bilan.saison)}` : 'première saison suivie', jauge: reglagesActifs().objectifProduits ? bilan.produits / reglagesActifs().objectifProduits : null },
    { libelle: 'Charges directes', valeur: euros(bilan.charges), detail: 'achats boutique et organisation des événements' },
    { libelle: 'Résultat', valeur: euros(bilan.resultat), detail: bilan.resultat >= 0 ? 'excédent avant frais généraux' : 'déficit avant frais généraux', ton: bilan.resultat < 0 ? 'alerte' : null },
    { libelle: 'Reste à percevoir', valeur: euros(bilan.attendu), detail: 'subventions accordées, factures et cotisations en attente' },
    { libelle: 'Bénévolat valorisé', valeur: euros(bilan.valorisation), detail: `contribution volontaire, hors budget monétaire` },
  ];

      carte({

          legende(segments, bilan.produits)),

      carte({

            categories: flux.map((f) => moisEtiquette(f.cle)),
            series: [

      })),

    h('div.grille-deux.grille-deux--inverse', {},

}

/* ================================================== vue-rapport.js */
/**
 * Rapport de saison. Une seule page, pensée pour l'impression : c'est le
 * document que l'on joint à un dossier de subvention ou que l'on projette
 * en assemblée générale. « Enregistrer en PDF » depuis la boîte d'impression
 * du navigateur produit un fichier propre, sans dépendance à un générateur
 * de PDF embarqué.
 */








function vueRapport() {
  const bilan = synthese();
  const r = reglagesActifs();
  const evolution = evolutionProduits();
  const segments = bilan.sources.map((s) => ({ libelle: s.module.titre, valeur: s.produits, couleur: s.module.couleur }));
  const attention = alertes();

  return h('div.page.page--rapport', {},
    h('div.rapport-actions', {},
      h('a.lien-retour', { href: '#/' }, 'Retour au tableau de bord'),

    h('article.rapport', {},
      h('header.rapport-tete', {},
        logo(56),
        h('div', {},
          h('h1', { text: `${r.association} — rapport de saison` }),
          h('p.rapport-sous-titre', { text: `${r.ligue} · saison ${bilan.saison} · ${r.territoire}` }),
          h('p.rapport-date', { text: `Édité le ${dateCourte(aujourdhui())}` }))),

      h('section.rapport-section', {},
        h('h2', { text: 'Équilibre de la saison' }),
        h('div.rapport-chiffres', {},
          h('div.rapport-chiffre', {}, h('span.rapport-chiffre-valeur', { text: euros(bilan.produits) }), h('span.rapport-chiffre-libelle', { text: 'produits' })),
          h('div.rapport-chiffre', {}, h('span.rapport-chiffre-valeur', { text: euros(bilan.charges) }), h('span.rapport-chiffre-libelle', { text: 'charges directes' })),
          h('div.rapport-chiffre', {}, h('span.rapport-chiffre-valeur', { text: euros(bilan.resultat) }), h('span.rapport-chiffre-libelle', { text: 'résultat' })),
          h('div.rapport-chiffre', {}, h('span.rapport-chiffre-valeur', { text: euros(bilan.attendu) }), h('span.rapport-chiffre-libelle', { text: 'reste à percevoir' })),
          h('div.rapport-chiffre', {}, h('span.rapport-chiffre-valeur', { text: euros(bilan.valorisation) }), h('span.rapport-chiffre-libelle', { text: 'bénévolat valorisé' }))),
        h('p.rapport-texte', {
          text: evolution
            ? `Les produits de la saison ${bilan.saison} s'établissent à ${euros(bilan.produits)}, contre ${euros(evolution.avant)} en ${saisonPrecedente(bilan.saison)}, soit une évolution de ${evolution.ecart >= 0 ? '+' : ''}${evolution.ecart.toFixed(1).replace('.', ',')} %. Le bénévolat, valorisé au taux de ${euros(r.tauxHoraire)} de l'heure, représente ${euros(bilan.valorisation)} de contribution volontaire en nature, à mentionner en annexe des comptes.`
            : `Les produits de la saison ${bilan.saison} s'établissent à ${euros(bilan.produits)}. Le bénévolat, valorisé au taux de ${euros(r.tauxHoraire)} de l'heure, représente ${euros(bilan.valorisation)} de contribution volontaire en nature.`,
        })),

      h('section.rapport-section.rapport-section--repartition', {},
        h('h2', { text: 'Répartition des produits' }),
        h('div.rapport-anneau', {},
          anneau(segments, { titre: 'Répartition des produits', centreValeur: euros(bilan.produits), centreLibelle: 'produits', taille: 200 }),
          legende(segments, bilan.produits))),

            h('th.aligne-droite', { scope: 'col', text: 'Produits' }),
            h('th.aligne-droite', { scope: 'col', text: 'Charges' }),
            h('th.aligne-droite', { scope: 'col', text: 'Part' }))),
          h('tbody', {}, bilan.parModule.map((p) => h('tr', {},

/* ================================================== vue-reglages.js */
/**
 * Réglages, sauvegarde et restauration. Tout ce qui touche à la base entière
 * est réuni ici plutôt que dispersé : effacer, restaurer et recharger le jeu
 * de démonstration sont des gestes rares et lourds de conséquences, ils
 * méritent un seul endroit et une confirmation.
 */







const CHAMPS_REGLAGES = [
  { id: 'association', libelle: 'Nom de l’association', type: 'text' },
  { id: 'ligue', libelle: 'Nom de la ligue', type: 'text' },
  { id: 'territoire', libelle: 'Territoire', type: 'text' },
  { id: 'tauxHoraire', libelle: 'Taux de valorisation du bénévolat (€/h)', type: 'number', aide: 'Sert au calcul des contributions volontaires en nature.' },
  { id: 'objectifProduits', libelle: 'Objectif de produits (€)', type: 'number' },
  { id: 'adherentsAttendus', libelle: 'Objectif d’adhérents', type: 'number' },
];

function classeurComplet() {
  const r = reglagesActifs();
  return versXLSX(MODULES.map((m) => tableModule(m, lignes(m.id, { toutesSaisons: true }), r)));
}

function vueReglages() {
  const r = reglagesActifs();
  const total = MODULES.reduce((t, m) => t + lignes(m.id, { toutesSaisons: true }).length, 0);
  const poids = new Blob([exporterBase()]).size;

  const formulaire = h('form.formulaire', { onsubmit: (e) => e.preventDefault() },
    h('div.grille-champs', {}, CHAMPS_REGLAGES.map((c) => h('div.champ', {},
      h('label.champ-libelle', { for: `reglage-${c.id}`, text: c.libelle }),
      h('input.saisie', {
        id: `reglage-${c.id}`, type: c.type, value: r[c.id], min: c.type === 'number' ? '0' : null,
        onchange: (e) => {
          const valeur = c.type === 'number' ? Number(e.target.value) || 0 : e.target.value.trim();
          majReglages({ [c.id]: valeur });
          toast('Réglage enregistré.');
        },
      }),
      c.aide ? h('p.champ-aide', { text: c.aide }) : null))));

  const restaurationFichier = h('input', { type: 'file', accept: 'application/json,.json', class: 'saisie' });
  restaurationFichier.addEventListener('change', async () => {
    const f = restaurationFichier.files[0];
    if (!f) return;
    try {
      const nb = restaurer(await f.text());
      toast(`Sauvegarde restaurée : ${nb} modules.`);
    } catch (e) {
      toast(e.message || 'Fichier illisible.', 'erreur');
    }
    restaurationFichier.value = '';
  });

  return h('div.page', {},
    h('header.page-tete', {},
      h('a.lien-retour', { href: '#/' }, 'Tableau de bord'),
      h('h1.page-titre', { text: 'Réglages et données' }),
      h('p.page-resume', { text: 'Identité de l’association, objectifs de la saison, et gestion de la base.' })),

    h('div.grille-deux', {},
      carte({ titre: 'Association et objectifs', sousTitre: 'les objectifs alimentent les jauges du tableau de bord', contenu: formulaire }),

      carte({
        titre: 'Base de données',
        sousTitre: stockageDisponible() ? 'enregistrée dans ce navigateur' : 'stockage indisponible — session en mémoire',
        contenu: h('div.pile', {},
          h('dl.definitions', {},
            h('dt', { text: 'Lignes enregistrées' }), h('dd', { text: nombre(total) }),
            h('dt', { text: 'Saisons couvertes' }), h('dd', { text: saisons().join(', ') }),
            h('dt', { text: 'Poids de la base' }), h('dd', { text: `${(poids / 1024).toFixed(0)} Ko` }),
            h('dt', { text: 'Jeu de données' }), h('dd', { text: estDemo() ? 'démonstration' : 'données de l’association' })),
          h('div.choix-export', {},
            bouton('Classeur Excel complet', { variante: 'primaire', icone: TRACE_ICONES.exporter, onclick: () => telecharger(nomHorodate('five-league-base', 'xlsx'), classeurComplet()) }),
            bouton('Sauvegarde JSON', { icone: TRACE_ICONES.exporter, onclick: () => telecharger(nomHorodate('five-league-sauvegarde', 'json'), exporterBase(), 'application/json') })),
          h('p.champ-libelle', { text: 'Restaurer une sauvegarde' }),
          restaurationFichier,
          h('p.texte-doux.petit', { text: 'La restauration remplace intégralement la base actuelle.' })),
      })),

    carte({
      titre: 'Saison et apparence',
      contenu: h('div.pile', {},
        h('div.champ', {},
          h('label.champ-libelle', { for: 'reglage-saison', text: 'Saison affichée' }),
          h('select.saisie', { id: 'reglage-saison', onchange: (e) => definirSaison(e.target.value) },
            [...new Set([...SAISONS, ...saisons()])].sort().map((s) => h('option', { value: s, text: s, selected: s === saisonActive() })))),
        h('div.champ', {},
          h('label.champ-libelle', { for: 'reglage-theme', text: 'Thème' }),
          h('select.saisie', { id: 'reglage-theme', onchange: (e) => definirTheme(e.target.value) },
            [['auto', 'Selon le système'], ['clair', 'Clair'], ['sombre', 'Sombre']].map(([v, t]) => h('option', { value: v, text: t, selected: themeEnregistre() === v }))))),
    }),

    carte({
      titre: 'Opérations sensibles',
      classe: 'carte--danger',
      contenu: h('div.pile', {},
        h('p.texte-doux', { text: 'Ces actions remplacent la base entière. Exportez une sauvegarde avant de les lancer.' }),
        h('div.choix-export', {},
          bouton('Recharger le jeu de démonstration', {
            onclick: async () => {
              if (await confirmer('Recharger la démonstration ?', 'Les données actuelles seront remplacées par l’association fictive de démonstration.')) {
                reinitialiser({ demo: true });
                toast('Jeu de démonstration rechargé.');
              }
            },
          }),
          bouton('Vider la base', {
            variante: 'danger',
            onclick: async () => {
              if (await confirmer('Vider toute la base ?', 'Les sept modules seront remis à zéro pour toutes les saisons.')) {
                reinitialiser({ demo: false });
                toast('Base vidée.', 'neutre');
              }
            },
          }))),
    }),

    carte({
      titre: 'Ce que l’outil ne fait pas (encore)',
      contenu: h('ul.liste-notes', {},
        h('li', { text: 'Les données vivent dans ce navigateur, sur cet appareil. Deux personnes qui saisissent chacune de leur côté travaillent sur deux bases distinctes : la sauvegarde JSON sert à les transmettre.' }),
        h('li', { text: 'Aucun compte ni mot de passe : un écran de connexion posé sur des données locales protégerait de la curiosité, pas d’un accès à la machine. Une vraie authentification suppose un serveur, et c’est l’étape suivante.' }),
        h('li', { text: 'La boutique décrit un catalogue, pas un journal de ventes daté : le chiffre d’affaires est donc annuel, non ventilé par mois.' })),
    }));
}

function ouvrirAide() {
  modale({
    titre: 'Prise en main',
    large: true,
    corps: h('div.pile', {},
      h('p', { text: 'Chaque domaine du modèle socio-économique a sa page : cliquez sur un secteur du hub, ou utilisez le menu en haut.' }),
      h('ul.liste-notes', {},
        h('li', { text: 'Ajouter, modifier, supprimer : les boutons se trouvent dans la barre d’outils de chaque module et au bout de chaque ligne.' }),
        h('li', { text: 'Tout est enregistré dans le navigateur au fil de la saisie ; aucune connexion n’est nécessaire.' }),
        h('li', { text: 'La saison se change en haut à droite : les tableaux et les indicateurs suivent.' }),
        h('li', { text: 'Exports : CSV et Excel par module, classeur complet et sauvegarde JSON dans les réglages, PDF par l’impression du rapport de saison.' })),
      h('p.texte-doux', { text: `Valorisation du bénévolat au taux de ${euros(reglagesActifs().tauxHoraire)} de l’heure — modifiable dans les réglages.` })),
    actions: [{ libelle: 'Fermer' }],
  });
}

/* ================================================== app.js */
/**
 * Coquille et routage. L'adresse porte l'état de navigation (`#/module/rh`) :
 * une page de module se partage par lien, le bouton « précédent » du
 * navigateur fonctionne, et l'impression d'un rapport garde son adresse.
 */











const MODULE_PAR_ROUTE = Object.fromEntries(MODULES.map((m) => [m.route, m]));

function routeCourante() {
  const brut = (window.location.hash || '#/').replace(/^#/, '');
  const morceaux = brut.split('/').filter(Boolean);
  if (morceaux[0] === 'module' && MODULE_PAR_ROUTE[morceaux[1]]) return { nom: 'module', module: MODULE_PAR_ROUTE[morceaux[1]] };
  if (morceaux[0] === 'rapport') return { nom: 'rapport' };
  if (morceaux[0] === 'reglages') return { nom: 'reglages' };
  return { nom: 'hub' };
}

function enTete() {
  const selecteurSaison = h('select.saisie.saisie--saison', {
    'aria-label': 'Saison affichée',
    onchange: (e) => definirSaison(e.target.value),
  }, [...new Set([...SAISONS, ...saisons()])].sort().map((s) => h('option', { value: s, text: s, selected: s === saisonActive() })));

  const boutonTheme = h('button.bouton-icone', {
    type: 'button',
    'aria-label': 'Changer de thème',
    title: 'Clair, sombre ou automatique',
    onclick: () => {
      const suite = { auto: 'clair', clair: 'sombre', sombre: 'auto' };
      const suivant = suite[themeEnregistre()] || 'clair';
      definirTheme(suivant);
      toast(`Thème : ${{ auto: 'automatique', clair: 'clair', sombre: 'sombre' }[suivant]}.`, 'neutre');
      rendre();
    },
  }, icone(themeEnregistre() === 'sombre' ? TRACE_ICONES.lune : TRACE_ICONES.soleil, 20));

  const route = routeCourante();
  return h('header.entete', {},
    h('a.marque', { href: '#/', 'aria-label': 'Tableau de bord Five League' },
      logo(38),
      h('span.marque-texte', {},
        h('span.marque-nom', { text: reglagesActifs().association }),
        h('span.marque-ligue', { text: reglagesActifs().ligue }))),
    h('nav.nav-modules', { 'aria-label': 'Domaines' },
      h('a.nav-lien', { href: '#/', class: route.nom === 'hub' ? 'nav-lien--actif' : '' }, icone(TRACE_ICONES.grille, 17), h('span', { text: 'Hub' })),
      MODULES.map((m) => h('a.nav-lien', {
        href: `#/module/${m.route}`,
        class: route.nom === 'module' && route.module.id === m.id ? 'nav-lien--actif' : '',
        style: { '--couleur-module': m.couleur },
      }, icone(m.icone, 17), h('span', { text: m.court })))),
    h('div.entete-outils', {},
      selecteurSaison,
      h('button.bouton-icone', { type: 'button', 'aria-label': 'Aide', title: 'Prise en main', onclick: ouvrirAide }, icone('M12 17h.01M9.5 9.2a2.6 2.6 0 1 1 3.3 2.5c-.6.2-.8.7-.8 1.3v.5M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z', 20)),
      boutonTheme,
      h('a.bouton-icone', { href: '#/reglages', 'aria-label': 'Réglages', title: 'Réglages et données' }, icone(TRACE_ICONES.reglages, 20))));
}

function bandeaux() {
  const messages = [];
  if (!stockageDisponible()) {
    messages.push(h('div.bandeau.bandeau--alerte', {}, icone(TRACE_ICONES.alerte, 18),
      h('span', { text: 'Ce navigateur refuse le stockage local : les saisies de cette session ne seront pas conservées. Exportez une sauvegarde avant de fermer l’onglet.' })));
  }
  if (estDemo()) {
    messages.push(h('div.bandeau', {}, icone(TRACE_ICONES.alerte, 18),
      h('span', {}, 'Données de démonstration — une association fictive, pour explorer l’outil. '),
      h('a', { href: '#/reglages', text: 'Vider la base et saisir les vôtres' })));
  }
  return messages.length ? h('div.bandeaux', {}, messages) : null;
}

function corps() {
  const route = routeCourante();
  if (route.nom !== 'module') quitterModule();
  switch (route.nom) {
    case 'module': return vueModule(route.module.id);
    case 'rapport': return vueRapport();
    case 'reglages': return vueReglages();
    default: return vueHub();
  }
}

let racine = null;

function rendre({ hautDePage = false } = {}) {
  const route = routeCourante();
  document.title = route.nom === 'module'
    ? `${route.module.titre} — ${reglagesActifs().association}`
    : `${reglagesActifs().association} — ${reglagesActifs().ligue}`;
  remplacer(racine, enTete(), bandeaux(), h('main.contenu', { id: 'contenu' }, corps()), piedDePage());
  if (hautDePage) window.scrollTo({ top: 0, behavior: 'instant' });
}

function piedDePage() {
  return h('footer.pied', {},
    h('p', { text: `${reglagesActifs().association} — outil de gestion interne. Données enregistrées sur cet appareil.` }),
    h('p', {}, h('a', { href: '#/rapport', text: 'Rapport de saison' }), ' · ', h('a', { href: '#/reglages', text: 'Réglages et données' })));
}

function demarrerApplication() {
  appliquerTheme(themeEnregistre());
  demarrerBase();
  racine = h('div.application');
  document.body.appendChild(racine);
  rendre();
  window.addEventListener('hashchange', () => rendre({ hautDePage: true }));
  abonner(() => rendre());
  /* Point d'entrée unique pour les bancs d'essai : ils pilotent l'application
     par cette surface plutôt que par le DOM, qui change avec le design. */
  window.FiveLeague = {
    MODULES, rendre, route: routeCourante,
    laBase, lignes, ajouterLigne, supprimerLigne, reinitialiser, exporterBase,
    saisonActive, saisons, definirSaison, reglagesActifs, estDemo, stockageDisponible,
    synthese, alertes, fluxMensuels, versXLSX, versCSV, tableModule,
  };
}


if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrerApplication);
else demarrerApplication();
})();

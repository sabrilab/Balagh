<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five League — Sunday Five League</title>
<meta name="description" content="Outil de gestion de l'association Five League : ressources humaines, cotisations, subventions, merchandising, événements, prestations et partenariats de la Sunday Five League.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1C3144">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2314283A'/%3E%3Cpath d='M32 12.5 45.5 22.3 40.3 38.2H23.7L18.5 22.3z' fill='%232ECC71'/%3E%3C/svg%3E">
<style>
/**
 * Feuille de style unique. Les couleurs, les rayons et les ombres passent
 * tous par des variables : le thème sombre ne redéfinit qu'elles, et un
 * changement d'identité visuelle se fait en un seul endroit.
 *
 * Palette : bleu marine de fond de marque, vert dynamique en accent, ambre
 * pour les alertes — la déclinaison « énergique sport » demandée au cahier
 * des charges, corrigée là où le vert d'origine ne tenait pas le contraste
 * de 4,5:1 sur fond clair.
 */

:root {
  color-scheme: light;

  --marine: #1C3144;
  --marine-clair: #2A4A66;
  --vert: #2ECC71;
  --vert-fonce: #17864A;
  --orange: #E67E22;
  --ambre: #B26A00;
  --ambre-texte: #8A5300;
  --rouge: #D6334C;
  --bleu: #3A72C4;
  --violet: #7D51C4;

  --accent: var(--vert-fonce);
  --accent-vif: var(--vert);
  --marque-fond: #14283A;
  --marque-accent: var(--vert);

  --fond: #F1F4F8;
  --fond-carte: #FFFFFF;
  --fond-doux: #F7F9FC;
  --fond-survol: #EDF1F6;
  --encre: #15202B;
  --encre-douce: #55677A;
  --encre-inverse: #FFFFFF;
  --trait: #DDE4EC;
  --trait-fort: #C4CEDA;
  --trait-graphe: #E4EAF1;

  --ombre-carte: 0 1px 2px rgba(21, 32, 43, .06), 0 8px 24px rgba(21, 32, 43, .05);
  --ombre-flottante: 0 12px 40px rgba(21, 32, 43, .18);
  --rayon: 14px;
  --rayon-petit: 9px;
  --largeur: 1240px;

  --police: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}

:root[data-theme="sombre"] {
  color-scheme: dark;
  --fond: #0D151E;
  --fond-carte: #16212D;
  --fond-doux: #1B2836;
  --fond-survol: #22303F;
  --encre: #EAF0F6;
  --encre-douce: #9FB0C2;
  --trait: #26333F;
  --trait-fort: #35465A;
  --trait-graphe: #26333F;
  --marine: #0B1520;
  --marque-fond: #0B1520;
  --accent: #35C97B;
  --ambre: #E0A030;
  --ambre-texte: #E8B255;
  --rouge: #F0637A;
  --bleu: #6FA0EC;
  --violet: #A98AE6;
  --ombre-carte: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .3);
  --ombre-flottante: 0 16px 44px rgba(0, 0, 0, .55);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="clair"]) {
    color-scheme: dark;
    --fond: #0D151E;
    --fond-carte: #16212D;
    --fond-doux: #1B2836;
    --fond-survol: #22303F;
    --encre: #EAF0F6;
    --encre-douce: #9FB0C2;
    --trait: #26333F;
    --trait-fort: #35465A;
    --trait-graphe: #26333F;
    --marine: #0B1520;
    --marque-fond: #0B1520;
    --accent: #35C97B;
    --ambre: #E0A030;
    --ambre-texte: #E8B255;
    --rouge: #F0637A;
    --bleu: #6FA0EC;
    --violet: #A98AE6;
    --ombre-carte: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .3);
    --ombre-flottante: 0 16px 44px rgba(0, 0, 0, .55);
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--fond);
  color: var(--encre);
  font-family: var(--police);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -0.015em; }
p { margin: 0; }
ul, ol, dl, dd { margin: 0; padding: 0; }
li { list-style: none; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: none; }
button { font: inherit; color: inherit; }
table { border-collapse: collapse; width: 100%; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.visuellement-cache {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%);
  white-space: nowrap;
}

.texte-doux { color: var(--encre-douce); }
.petit { font-size: 12.5px; line-height: 1.45; }
.aligne-droite { text-align: right; font-variant-numeric: tabular-nums; }
.pile { display: grid; gap: 14px; }

/* ------------------------------------------------------------- En-tête */

.application { min-height: 100vh; display: flex; flex-direction: column; }

.entete {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px max(16px, calc((100vw - var(--largeur)) / 2));
  background: color-mix(in srgb, var(--fond-carte) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--trait);
}

.marque { display: flex; align-items: center; gap: 10px; min-height: 44px; flex: none; }
.marque-texte { display: flex; flex-direction: column; }
.marque-nom { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.marque-ligue { font-size: 11.5px; color: var(--encre-douce); }

.nav-modules {
  display: flex;
  gap: 4px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px;
}
.nav-modules::-webkit-scrollbar { display: none; }

.nav-lien {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 11px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 550;
  color: var(--encre-douce);
  white-space: nowrap;
  transition: background .16s ease, color .16s ease;
}
.nav-lien .icone { color: var(--couleur-module, var(--encre-douce)); }
.nav-lien:hover { background: var(--fond-survol); color: var(--encre); }
.nav-lien--actif {
  background: color-mix(in srgb, var(--couleur-module, var(--accent)) 14%, transparent);
  color: var(--encre);
}

.entete-outils { display: flex; align-items: center; gap: 6px; flex: none; }

.bouton-icone {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px; height: 40px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: var(--encre-douce);
  cursor: pointer;
  transition: background .16s ease, color .16s ease;
}
.bouton-icone:hover { background: var(--fond-survol); color: var(--encre); }
.bouton-icone--danger:hover { background: color-mix(in srgb, var(--rouge) 14%, transparent); color: var(--rouge); }

/* --------------------------------------------------------------- Bandeaux */

.bandeaux { display: grid; gap: 8px; padding: 12px max(16px, calc((100vw - var(--largeur)) / 2)) 0; }
.bandeau {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: var(--rayon-petit);
  background: color-mix(in srgb, var(--ambre) 12%, var(--fond-carte));
  border: 1px solid color-mix(in srgb, var(--ambre) 32%, transparent);
  font-size: 13px;
}
.bandeau .icone { color: var(--ambre); flex: none; }
.bandeau a { text-decoration: underline; font-weight: 600; }
.bandeau--alerte { background: color-mix(in srgb, var(--rouge) 12%, var(--fond-carte)); border-color: color-mix(in srgb, var(--rouge) 34%, transparent); }
.bandeau--alerte .icone { color: var(--rouge); }

/* ---------------------------------------------------------------- Contenu */

.contenu {
  flex: 1;
  width: 100%;
  max-width: var(--largeur);
  margin: 0 auto;
  padding: 22px 16px 56px;
}

.page { display: grid; gap: 20px; }

.page-tete { display: grid; gap: 6px; }
.page-tete-haut { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sur-titre { font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--encre-douce); }
.page-titre { font-size: clamp(24px, 3.6vw, 33px); font-weight: 700; }
.page-resume { color: var(--encre-douce); max-width: 68ch; }

.lien-retour {
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 40px;
  font-size: 13px; font-weight: 600; color: var(--encre-douce);
}
.lien-retour:hover { color: var(--accent); }

.puce-module {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12.5px; font-weight: 650;
  background: color-mix(in srgb, var(--accent-module, var(--accent)) 14%, transparent);
  color: var(--encre);
}
.puce-module .icone { color: var(--accent-module, var(--accent)); }

.hub-tete { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.hub-tete-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ------------------------------------------------------------------ Cartes */

.carte {
  background: var(--fond-carte);
  border: 1px solid var(--trait);
  border-radius: var(--rayon);
  box-shadow: var(--ombre-carte);
  overflow: hidden;
}
.carte-tete {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  padding: 16px 18px 0;
}
.carte-titre { font-size: 16px; font-weight: 650; }
.carte-sous-titre { font-size: 12.5px; color: var(--encre-douce); margin-top: 2px; }
.carte-corps { padding: 16px 18px 18px; }
.carte--tableau .carte-corps { padding: 12px 0 0; }
.carte--danger { border-color: color-mix(in srgb, var(--rouge) 30%, var(--trait)); }

.grille-deux { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.grille-deux--inverse { grid-template-columns: 5fr 7fr; }
/* Le tableau prend toute la largeur : neuf colonnes plus les actions ne
   tiennent pas à côté d'un graphique, et une colonne d'actions coupée est
   pire qu'un graphique plus bas. Au-delà de quelques dizaines de lignes, le
   tableau défile sous son propre en-tête, resté collé en haut. */
.colonnes-module { display: grid; gap: 16px; align-items: start; }
.carte--tableau .tableau-cadre { max-height: 68vh; overflow: auto; }

/* --------------------------------------------------------------- Indicateurs */

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpis--large { grid-template-columns: repeat(5, minmax(0, 1fr)); }

.kpi {
  position: relative;
  padding: 14px 16px 15px;
  background: var(--fond-carte);
  border: 1px solid var(--trait);
  border-radius: var(--rayon);
  box-shadow: var(--ombre-carte);
  display: grid;
  gap: 5px;
  align-content: start;
}
.kpi::before {
  content: "";
  position: absolute; left: 0; top: 14px; bottom: 14px;
  width: 3px; border-radius: 0 3px 3px 0;
  background: var(--kpi-accent, var(--accent));
}
.kpi--alerte::before { background: var(--rouge); }
.kpi-libelle { font-size: 12px; font-weight: 600; color: var(--encre-douce); text-transform: uppercase; letter-spacing: .04em; }
.kpi-valeur { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi-detail { font-size: 12.5px; color: var(--encre-douce); }

.jauge { display: block; height: 5px; border-radius: 999px; background: var(--trait-graphe); overflow: hidden; }
.jauge-remplissage { display: block; height: 100%; border-radius: 999px; }

/* ---------------------------------------------------------------- Le hub */

.hub {
  position: relative;
  width: min(760px, 100%);
  aspect-ratio: 1;
  margin: 4px auto 6px;
  container-type: inline-size;
}
.hub-liens { position: absolute; inset: 0; width: 100%; height: 100%; }

.hub-centre {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 35cqw; height: 35cqw;
  border-radius: 50%;
  background-color: var(--marine);
  background-image: radial-gradient(circle at 30% 25%, var(--marine-clair), var(--marine) 70%);
  color: #fff;
  display: grid;
  place-content: center;
  justify-items: center;
  text-align: center;
  gap: 1px;
  box-shadow: var(--ombre-flottante);
  padding: 2cqw;
}
.hub-centre-nom { font-size: 3cqw; font-weight: 700; letter-spacing: -0.01em; margin-top: .6cqw; }
.hub-centre-ligue { font-size: 1.9cqw; color: rgba(255, 255, 255, .72); }
.hub-centre-valeur { font-size: 3.6cqw; font-weight: 700; margin-top: 1.2cqw; font-variant-numeric: tabular-nums; }
.hub-centre-detail { font-size: 1.7cqw; color: rgba(255, 255, 255, .72); }

/* En thème sombre, le médaillon et le fond partagent le même bleu nuit :
   un liseré le détache sans ajouter de bordure visible en thème clair. */
:root[data-theme="sombre"] .hub-centre { box-shadow: 0 0 0 1px var(--trait-fort), var(--ombre-flottante); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="clair"]) .hub-centre { box-shadow: 0 0 0 1px var(--trait-fort), var(--ombre-flottante); }
}

.hub-noeud {
  position: absolute;
  left: var(--x); top: var(--y);
  transform: translate(-50%, -50%);
  width: 23cqw;
  min-height: 23cqw;
  padding: 1.6cqw 1cqw;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: .5cqw;
  text-align: center;
  background: var(--fond-carte);
  border: 1px solid var(--trait);
  border-radius: 50%;
  box-shadow: var(--ombre-carte);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.hub-noeud:hover, .hub-noeud:focus-visible {
  transform: translate(-50%, -50%) scale(1.06);
  border-color: var(--couleur-module);
  box-shadow: var(--ombre-flottante);
}
.hub-noeud-icone {
  display: grid; place-items: center;
  width: 6.6cqw; height: 6.6cqw;
  border-radius: 50%;
  color: #fff;
  background: var(--couleur-module);
}
.hub-noeud-icone .icone { width: 55%; height: 55%; }
.hub-noeud-titre { font-size: 2.15cqw; font-weight: 650; }
.hub-noeud-valeur { font-size: 1.85cqw; color: var(--encre-douce); font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------------- Graphiques */

.anneau-bloc { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.graphe-anneau { flex: none; max-width: 100%; height: auto; }
.anneau-part { transition: opacity .16s ease; }
.graphe-anneau:hover .anneau-part { opacity: .45; }
.graphe-anneau .anneau-part:hover { opacity: 1; }
.anneau-valeur { font-size: 21px; font-weight: 700; fill: var(--encre); font-family: var(--police); }
.anneau-libelle { font-size: 11.5px; fill: var(--encre-douce); font-family: var(--police); text-transform: uppercase; letter-spacing: .05em; }

.legende { display: grid; gap: 7px; }
.legende-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.legende-pastille { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legende-nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legende-valeur { color: var(--encre-douce); font-variant-numeric: tabular-nums; }
.legende-plate { display: flex; gap: 16px; }

.graphe-cadre { width: 100%; }
.graphe-barres { display: block; max-width: 100%; }
.graphe-axe { font-size: 11px; fill: var(--encre-douce); font-family: var(--police); }
.barre { transition: opacity .16s ease; }
.barre:hover { opacity: .75; }

.barres-h { display: grid; gap: 9px; }
.barre-h { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; font-size: 13px; }
.barre-h-nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barre-h-piste { display: block; height: 8px; border-radius: 999px; background: var(--trait-graphe); overflow: hidden; }
.barre-h-remplissage { display: block; height: 100%; border-radius: 999px; }
.barre-h-valeur { font-size: 12.5px; color: var(--encre-douce); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ Alertes */

.alertes { display: grid; gap: 8px; }
.alerte {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 11px 13px;
  border-radius: var(--rayon-petit);
  background: var(--fond-doux);
  border: 1px solid var(--trait);
  border-left: 3px solid var(--couleur-module);
  transition: background .16s ease, transform .16s ease;
}
.alerte:hover { background: var(--fond-survol); }
.alerte-icone { color: var(--encre-douce); flex: none; margin-top: 1px; }
.alerte--haute .alerte-icone { color: var(--rouge); }
.alerte--moyenne .alerte-icone { color: var(--ambre); }
.alerte-texte { display: grid; gap: 2px; flex: 1; min-width: 0; }
.alerte-titre { font-weight: 600; font-size: 13.5px; }
.alerte-detail { font-size: 12.5px; color: var(--encre-douce); }
.alerte-module { font-size: 11px; font-weight: 650; color: var(--encre-douce); text-transform: uppercase; letter-spacing: .04em; flex: none; }

/* ------------------------------------------------------------------ Boutons */

.bouton {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 40px;
  padding: 0 15px;
  border: 1px solid var(--trait-fort);
  border-radius: 10px;
  background: var(--fond-carte);
  color: var(--encre);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background .16s ease, border-color .16s ease, transform .1s ease;
}
.bouton:hover { background: var(--fond-survol); }
.bouton:active { transform: translateY(1px); }
.bouton--primaire { background: var(--accent); border-color: var(--accent); color: #fff; }
.bouton--primaire:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.bouton--danger { background: var(--rouge); border-color: var(--rouge); color: #fff; }
.bouton--danger:hover { background: color-mix(in srgb, var(--rouge) 88%, #000); }
:root[data-theme="sombre"] .bouton--primaire, :root[data-theme="sombre"] .bouton--danger { color: #0B1520; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="clair"]) .bouton--primaire,
  :root:not([data-theme="clair"]) .bouton--danger { color: #0B1520; }
}

/* --------------------------------------------------------------- Formulaires */

.barre-outils {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.barre-outils-gauche { display: flex; gap: 8px; flex: 1; min-width: 260px; flex-wrap: wrap; align-items: center; }
.barre-outils-droite { display: flex; gap: 8px; flex-wrap: wrap; }

.saisie {
  min-height: 40px;
  padding: 8px 11px;
  border: 1px solid var(--trait-fort);
  border-radius: 10px;
  background: var(--fond-carte);
  color: var(--encre);
  font: inherit;
  font-size: 13.5px;
  width: 100%;
}
.saisie:focus-visible { border-color: var(--accent); }
.saisie--recherche { flex: 1; min-width: 200px; max-width: 380px; }
.saisie--filtre, .saisie--saison { width: auto; min-width: 140px; }
.saisie--saison { min-width: 118px; }
.saisie--code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
textarea.saisie { resize: vertical; }

.bascule { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; font-size: 13px; color: var(--encre-douce); cursor: pointer; }
.bascule input { width: 16px; height: 16px; accent-color: var(--accent); }

.formulaire { display: grid; gap: 14px; }
.grille-champs { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.champ { display: grid; gap: 5px; align-content: start; }
.champ--large { grid-column: 1 / -1; }
.champ-libelle { font-size: 12.5px; font-weight: 600; color: var(--encre-douce); }
.champ-aide { font-size: 11.5px; color: var(--encre-douce); }
.requis { color: var(--rouge); }
[aria-invalid="true"] { border-color: var(--rouge); }

.choix-export { display: flex; flex-wrap: wrap; gap: 8px; }

.selecteur-fichier { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; cursor: pointer; }
.champ-fichier { position: absolute; width: 1px; height: 1px; opacity: 0; }
.champ-fichier:focus-visible + .bouton { outline: 2px solid var(--accent); outline-offset: 2px; }
.selecteur-fichier:hover .bouton { background: var(--fond-survol); }

<script>
(() => {
'use strict';

/* ================================================== format.js */
/**
 * Formatage. Tout l'affichage chiffré passe par ici : une seule règle par
 * type de valeur, appliquée partout, évite les tableaux où deux colonnes
 * écrivent les euros différemment.
 */

const FMT_EUROS = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const FMT_EUROS_CENT = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2 });
const FMT_NOMBRE = new Intl.NumberFormat('fr-FR');

/** Les montants d'un tableau de bord se lisent à l'euro près, pas au centime. */
const euros = (n, precis = false) => (precis ? FMT_EUROS_CENT : FMT_EUROS).format(Number(n) || 0);

/** Version compacte pour les pastilles du hub, où la place manque. */
function eurosCourt(n) {
  const v = Number(n) || 0;
  if (Math.abs(v) >= 10000) return `${FMT_NOMBRE.format(Math.round(v / 1000))} k€`;
  return FMT_EUROS.format(v);
}

const nombre = (n) => FMT_NOMBRE.format(Number(n) || 0);

function pourcent(part, total, decimales = 0) {
  if (!total) return '0 %';
  return `${((part / total) * 100).toFixed(decimales).replace('.', ',')} %`;
}

const heures = (n) => `${FMT_NOMBRE.format(Math.round(Number(n) || 0))} h`;

const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const MOIS_LONG = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

/** Les dates sont stockées en ISO (`2026-03-08`) : comparables comme du texte. */
function dateCourte(iso) {
  if (!iso) return '—';
  const [a, m, j] = String(iso).split('-');
  if (!j) return iso;
  return `${Number(j)} ${MOIS[Number(m) - 1]} ${a}`;
}

function moisEtiquette(cle) {
  const [a, m] = cle.split('-');
  return `${MOIS[Number(m) - 1]} ${String(a).slice(2)}`;

const moisDe = (iso) => (iso ? String(iso).slice(0, 7) : '');
const aujourdhui = () => new Date().toISOString().slice(0, 10);

/** Nombre de jours d'ici la date donnée : négatif si elle est passée. */
const joursRestants = (iso) =>
  Math.round((Date.parse(`${iso}T00:00:00`) - Date.parse(`${aujourdhui()}T00:00:00`)) / 86400000);

function delaiHumain(iso) {
  const j = joursRestants(iso);
  if (j === 0) return "aujourd'hui";
  if (j === 1) return 'demain';
  if (j > 0) return `dans ${j} j`;
  return `il y a ${-j} j`;

let compteur = 0;
const identifiant = (prefixe = 'r') => `${prefixe}-${Date.now().toString(36)}-${(compteur++).toString(36)}`;

/** Comparaison insensible à la casse et aux accents, pour le tri et la recherche. */
const plie = (s) => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const normalise = plie;
const contient = (valeur, requete) => plie(valeur).includes(plie(requete));

const TYPES_CHIFFRES = ['montant', 'nombre', 'heures'];

function comparer(a, b, type) {
  if (TYPES_CHIFFRES.includes(type)) return (Number(a) || 0) - (Number(b) || 0);
  return plie(a).localeCompare(plie(b), 'fr');

/** Bornes d'une saison sportive : du 1er septembre au 31 août. */
function bornesSaison(saison) {
  const [debut] = String(saison).split('-');
  const a = Number(debut);
  return { debut: `${a}-09-01`, fin: `${a + 1}-08-31` };
}

/** Saison en cours à la date du jour. */
function saisonDuJour(date = new Date()) {
  const a = date.getFullYear();
  return date.getMonth() >= 8 ? `${a}-${a + 1}` : `${a - 1}-${a}`;

const dansSaison = (iso, saison) => {
  if (!iso) return false;
  const { debut, fin } = bornesSaison(saison);
  return iso >= debut && iso <= fin;

/* ================================================== dom.js */
/**
 * Fabrique de DOM. Pas de moteur de gabarits : `h()` suffit, et une fonction
 * de 30 lignes se relit plus vite qu'une dépendance de 40 Ko.
 *
 *   h('article.carte', { role: 'group' }, h('h3', {}, 'Titre'), 'texte')
 *
 * Le sélecteur du premier argument accepte les classes et l'identifiant :
 * `'button.puce.puce--vert#tri'`.
 */

const SVG_NS = 'http://www.w3.org/2000/svg';
const BALISES_SVG = new Set(['svg', 'g', 'path', 'circle', 'rect', 'line', 'polyline', 'polygon', 'text', 'tspan', 'defs', 'linearGradient', 'radialGradient', 'stop', 'clipPath', 'title', 'use', 'ellipse']);

function h(selecteur, attributs = {}, ...enfants) {
  const [balise, ...reste] = String(selecteur).split(/(?=[.#])/);
  const nom = balise || 'div';
  const el = BALISES_SVG.has(nom) ? document.createElementNS(SVG_NS, nom) : document.createElement(nom);
  for (const morceau of reste) {
    if (morceau[0] === '#') el.id = morceau.slice(1);
    else el.classList.add(morceau.slice(1));
  }
  for (const [cle, valeur] of Object.entries(attributs || {})) {
    if (valeur === null || valeur === undefined || valeur === false) continue;
    if (cle === 'class') { for (const c of String(valeur).split(' ')) if (c) el.classList.add(c); }
    else if (cle === 'text') el.textContent = valeur;
    else if (cle === 'style' && typeof valeur === 'object') appliquerStyle(el, valeur);
    else if (cle === 'dataset') Object.assign(el.dataset, valeur);
    else if (cle.startsWith('on') && typeof valeur === 'function') el.addEventListener(cle.slice(2).toLowerCase(), valeur);
    else if (cle in el && !BALISES_SVG.has(nom) && typeof valeur !== 'object' && cle !== 'list') el[cle] = valeur;

/** Les propriétés personnalisées (`--x`) échappent à l'affectation directe :
 *  `style['--x'] = …` est ignoré, seul `setProperty` les enregistre. */
function appliquerStyle(el, style) {
  for (const [propriete, valeur] of Object.entries(style)) {
    if (valeur === null || valeur === undefined) continue;
    if (propriete.startsWith('--')) el.style.setProperty(propriete, String(valeur));
    else el.style[propriete] = valeur;

function ajouter(parent, enfants) {
  for (const enfant of enfants.flat(4)) {
    if (enfant === null || enfant === undefined || enfant === false) continue;
    parent.appendChild(enfant instanceof Node ? enfant : document.createTextNode(String(enfant)));

function vider(el) {

let fermerCourant = null;

    const cibles = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', boite).filter((el) => !el.disabled && el.offsetParent !== null);
    if (!cibles.length) return;
    const premier = cibles[0];
    const dernier = cibles[cibles.length - 1];
    if (e.shiftKey && document.activeElement === premier) { e.preventDefault(); dernier.focus(); }
    else if (!e.shiftKey && document.activeElement === dernier) { e.preventDefault(); premier.focus(); }
  };
  ajouter(boite, [
    h('header.modale-tete', {}, h('h2', { text: titre }), h('button.bouton-icone', { type: 'button', 'aria-label': 'Fermer la fenêtre', onclick: fermer }, icone('M6 6l12 12M18 6L6 18', 20))),
    h('div.modale-corps', {}, corps),
    actions.length ? h('footer.modale-pied', {}, actions.map((a) => h(`button.bouton${a.variante ? `.bouton--${a.variante}` : ''}`, { type: a.type || 'button', text: a.libelle, onclick: a.action ? () => a.action(fermer) : fermer }))) : null,
  ]);
  fond.appendChild(boite);
  fond.addEventListener('mousedown', (e) => { if (e.target === fond) fermer(); });
  document.body.appendChild(fond);
  document.addEventListener('keydown', auClavier, true);
  fermerCourant = fermer;
  requestAnimationFrame(() => ($('input, select, textarea, button', boite) || boite).focus());
  return { fermer, boite };
}

function confirmer(question, detail) {
  return new Promise((resoudre) => {
    modale({
      titre: question,
      corps: h('p.texte-doux', { text: detail || 'Cette action est définitive.' }),
      actions: [
        { libelle: 'Annuler', action: (fermer) => { fermer(); resoudre(false); } },
        { libelle: 'Supprimer', variante: 'danger', action: (fermer) => { fermer(); resoudre(true); } },
      ],
    });
  });
}

let pileToasts = null;
function toast(message, variante = 'succes') {
  if (!pileToasts) {
    pileToasts = h('div.toasts', { role: 'status', 'aria-live': 'polite' });
    document.body.appendChild(pileToasts);
  }
  const el = h(`div.toast.toast--${variante}`, { text: message });
  pileToasts.appendChild(el);
  setTimeout(() => { el.classList.add('toast--sortie'); setTimeout(() => el.remove(), 300); }, 3400);
}

};

const somme = (lignes, champ) => lignes.reduce((t, l) => t + (Number(l[champ]) || 0), 0);
const parmi = (lignes, champ, ...valeurs) => lignes.filter((l) => valeurs.includes(l[champ]));

/** État d'une cotisation : déduit des montants, jamais saisi — deux sources
 *  de vérité pour la même information finissent toujours par diverger. */
function etatCotisation(l) {
  const du = Number(l.montant) || 0;
  const regle = Number(l.regle) || 0;
  if (regle >= du && du > 0) return 'Payée';
  if (regle > 0) return 'Partielle';
  if (l.echeance && joursRestants(l.echeance) < 0) return 'Relancée';
  return 'En attente';
}

function etatStock(l) {
  const stock = Number(l.stock) || 0;
  if (stock <= 0) return 'Rupture';
  if (stock <= (Number(l.seuil) || 0)) return 'Stock faible';
  return 'En stock';
}

function alea(graine) {
  let a = graine >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Dimanches d'une saison, du premier de septembre au dernier de juin. */
function dimanches(saison) {
  const { debut } = bornesSaison(saison);
  const d = new Date(`${debut}T12:00:00Z`);
  while (d.getUTCDay() !== 0) d.setUTCDate(d.getUTCDate() + 1);
  const sorties = [];
  const limite = `${Number(saison.split('-')[1])}-06-30`;
  while (d.toISOString().slice(0, 10) <= limite) {
    const iso = d.toISOString().slice(0, 10);
    const mois = iso.slice(5, 7);
    if (mois !== '12' || Number(iso.slice(8)) < 20) sorties.push(iso);
    d.setUTCDate(d.getUTCDate() + 14);
  }
  return sorties;
}

const decalage = (iso, jours) => {
  const d = new Date(`${iso}T12:00:00Z`);
  d.setUTCDate(d.getUTCDate() + jours);
  return d.toISOString().slice(0, 10);
};

/**
 * Construit la base de démonstration : deux saisons complètes et l'amorce de
 * la suivante. `jour` fixe la date de référence — les événements passés sont
 * réalisés, les suivants restent planifiés.
 */
function baseDemo(jour = new Date().toISOString().slice(0, 10)) {
  const r = alea(20260419);
  const entier = (min, max) => min + Math.floor(r() * (max - min + 1));
  const choix = (liste) => liste[Math.floor(r() * liste.length)];
  const chance = (p) => r() < p;
  const donnees = { rh: [], cotisations: [], subventions: [], boutique: [], evenements: [], prestations: [], partenariats: [] };
  const ajoute = (cle, ligne) => donnees[cle].push({ id: identifiant(cle.slice(0, 3)), creeLe: jour, majLe: jour, ...ligne });

  const saisons = [
    { saison: '2024-2025', part: 0.74, close: true },
    { saison: '2025-2026', part: 1, close: false },
  ];

  for (const { saison, part, close } of saisons) {
    const an = Number(saison.split('-')[0]);
    const { debut } = bornesSaison(saison);

    /* -------- Ressources humaines */
    const effectif = Math.round(ROLES.length * part);
    const benevoles = [];
    for (let i = 0; i < effectif; i++) {
      const [role, pole, heuresBase] = ROLES[i];
      const nom = `${PRENOMS[(i * 5 + an) % PRENOMS.length]} ${NOMS[(i * 7 + an) % NOMS.length]}`;
      const h = Math.round(heuresBase * (0.8 + r() * 0.4) * part);
      benevoles.push(nom);
      ajoute('rh', {
        saison, nom, role, categorie: pole,
        statut: h > 60 ? 'Actif' : chance(0.7) ? 'Ponctuel' : 'Inactif',
        heures: h,
        courriel: `${nom.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]+/g, '.')}@fiveleague.fr`,
        telephone: `06 ${entier(10, 99)} ${entier(10, 99)} ${entier(10, 99)} ${entier(10, 99)}`,
        depuis: `${an - entier(0, 4)}-09-${String(entier(1, 28)).padStart(2, '0')}`,
        notes: pole === 'Arbitrage' ? 'Disponible les dimanches matin.' : '',
      });
    }

    /* -------- Cotisations */
    const tarifs = { 'Joueur senior': 120, 'Joueur jeune': 70, Dirigeant: 40, Arbitre: 30, 'Membre bienfaiteur': 150 };
    const effectifs = { 'Joueur senior': Math.round(84 * part), 'Joueur jeune': Math.round(24 * part), Dirigeant: Math.round(11 * part), Arbitre: Math.round(8 * part), 'Membre bienfaiteur': Math.round(5 * part) };
    let n = 0;
    for (const [categorie, total] of Object.entries(effectifs)) {
      for (let i = 0; i < total; i++, n++) {
        const montant = tarifs[categorie] + (categorie === 'Membre bienfaiteur' ? entier(0, 4) * 50 : 0);
        const solde = close ? chance(0.97) : chance(0.84);
        const partiel = !solde && chance(0.35);
        const regle = solde ? montant : partiel ? Math.round(montant / 2) : 0;
        const datePaiement = regle ? decalage(debut, entier(0, 160)) : '';
        ajoute('cotisations', {
          saison,
          adherent: `${PRENOMS[(n * 3 + an * 2) % PRENOMS.length]} ${NOMS[(n * 11 + an) % NOMS.length]}`,
          categorie,
          equipe: categorie.startsWith('Joueur') ? EQUIPES[n % EQUIPES.length] : '',
          montant, regle,
          moyen: regle ? choix(['Virement', 'Carte (HelloAsso)', 'Espèces', 'Chèque', "Pass'Sport"]) : 'Virement',
          datePaiement,
          echeance: decalage(debut, 60),
          courriel: '',
          notes: !solde && !close ? 'Relance à faire.' : '',
        });
      }
    }

    /* -------- Subventions */
    const dossiers = Math.round(FINANCEURS.length * part);
    for (let i = 0; i < dossiers; i++) {
      const [financeur, dispositif, base] = FINANCEURS[i];
      const demande = Math.round((base * (0.9 + r() * 0.3)) / 50) * 50;
      const issue = close ? (chance(0.72) ? 'Versée' : 'Refusée') : i % 5 === 0 ? 'En instruction' : i % 7 === 3 ? 'Refusée' : chance(0.7) ? 'Versée' : 'Accordée';
      const accorde = issue === 'Refusée' ? 0 : Math.round((demande * (0.6 + r() * 0.4)) / 50) * 50;
      const depot = decalage(debut, entier(5, 90));
      ajoute('subventions', {
        saison, financeur, dispositif, demande, accorde,
        statut: issue,
        echeance: decalage(depot, entier(3, 20)),
        dateDepot: depot,
        dateVersement: issue === 'Versée' ? decalage(depot, entier(60, 190)) : '',
        referent: choix(benevoles.slice(0, 4)),
        notes: issue === 'Refusée' ? 'Dossier non retenu — à redéposer avec un budget prévisionnel détaillé.' : '',
      });

    /* -------- Boutique */
    for (const [produit, categorie, prix, cout, vendusBase, stockBase] of ARTICLES.slice(0, Math.round(ARTICLES.length * part))) {
      ajoute('boutique', {
        saison, produit, categorie,
        prixVente: prix, coutUnitaire: cout,
        vendus: Math.round(vendusBase * part * (0.85 + r() * 0.3)),
        stock: Math.round(stockBase * (0.7 + r() * 0.6)),
        seuil: categorie === 'Maillot' ? 10 : 8,
        fournisseur: categorie === 'Goodies' ? 'Objets Pub Nord' : 'Textile Pro Lille',

    const journees = dimanches(saison);

    const speciaux = [
      ['Tournoi de Noël', 'Tournoi', `${an}-12-21`, 16, 1200, 800],

      ['Assemblée générale ordinaire', 'Assemblée générale', `${an + 1}-06-26`, 0, 0, 150],
    ];
    for (const [intitule, type, date, equipes, recettes, depenses] of speciaux) {
      if (!close && date > decalage(jour, 120)) continue;
      ajoute('evenements', {
        saison, intitule, type, date,
        lieu: type === 'Assemblée générale' ? 'Maison des associations, Roubaix' : SALLES[0],
        equipes, participants: equipes * 9 + entier(20, 60),
        recettes: Math.round(recettes * (0.9 + r() * 0.2)),
        depenses: Math.round(depenses * (0.9 + r() * 0.2)),
        statut: date <= jour ? 'Réalisé' : 'Confirmé',
        responsable: choix(benevoles.slice(0, 6)),
        notes: '',
      });
    }

    /* -------- Prestations */
    const affaires = Math.round(CLIENTS.length * part);
    for (let i = 0; i < affaires; i++) {
      const [client, prestation, base] = CLIENTS[i];
      const date = decalage(debut, entier(20, 300));
      const montant = Math.round((base * (0.9 + r() * 0.25)) / 10) * 10;
      const statut = close ? (chance(0.9) ? 'Payée' : 'Annulée')
        : date > jour ? (chance(0.5) ? 'Devis envoyé' : 'Confirmée')
          : chance(0.7) ? 'Payée' : chance(0.6) ? 'Facturée' : 'Annulée';
      ajoute('prestations', {
        saison, client, prestation, date, montant, statut,
        echeance: decalage(date, 30),
        contact: `${choix(PRENOMS)} ${choix(NOMS)}`,
        courriel: '',
        notes: prestation === "Animation d'entreprise" ? 'Tournoi interne, 3 h, encadrement et arbitrage inclus.' : '',
      });
    }

    /* -------- Partenariats */
    const contrats = Math.round(PARTENAIRES.length * part);
    for (let i = 0; i < contrats; i++) {
      const [entreprise, type, base, nature] = PARTENAIRES[i];
      const montant = Math.round((base * (0.9 + r() * 0.2)) / 50) * 50;
      const enNego = !close && i % 6 === 5;
      const fin = `${an + 1}-08-31`;
      ajoute('partenariats', {
        saison, entreprise, type, montant,
        encaisse: enNego ? 0 : close ? montant : Math.round((montant * (chance(0.7) ? 1 : 0.5)) / 10) * 10,
        statut: enNego ? 'En négociation' : close ? 'Terminé' : chance(0.35) ? 'À renouveler' : 'Actif',
        debut: `${an}-09-01`, fin,
        contact: `${choix(PRENOMS)} ${choix(NOMS)}`,
        courriel: '',
        nature,
        notes: '',
      });
    }
  }

  /* -------- Amorce de la saison suivante : ce qui se prépare dès l'été. */
  const suivante = '2026-2027';
  ajoute('subventions', { saison: suivante, financeur: 'Agence nationale du Sport', dispositif: 'Projet Sportif Fédéral 2026-2027', demande: 4800, accorde: 0, statut: 'Déposé', echeance: '2026-09-15', dateDepot: '2026-08-04', dateVersement: '', referent: 'Karim Delcroix', notes: 'Accusé de réception reçu.' });
  ajoute('subventions', { saison: suivante, financeur: 'Ville de Roubaix', dispositif: 'Subvention de fonctionnement 2027', demande: 2800, accorde: 0, statut: 'À déposer', echeance: '2026-10-31', dateDepot: '', dateVersement: '', referent: 'Nadia Bouchard', notes: 'Dossier à retirer en mairie début septembre.' });
  ajoute('partenariats', { saison: suivante, entreprise: 'Garage Delcroix', type: 'Sponsor maillot', montant: 2400, encaisse: 0, statut: 'En négociation', debut: '2026-09-01', fin: '2027-08-31', contact: 'Julien Delcroix', courriel: '', nature: 'Reconduction avec logo dos du maillot en plus', notes: 'Rendez-vous fixé fin août.' });
  ajoute('evenements', { saison: suivante, intitule: 'Tournoi de rentrée', type: 'Tournoi', date: '2026-09-06', lieu: SALLES[0], equipes: 12, participants: 120, recettes: 620, depenses: 430, statut: 'Confirmé', responsable: 'Karim Delcroix', notes: 'Ouverture de la saison, inscriptions ouvertes.' });

  return { version: 1, saison: '', reglages: { ...REGLAGES_DEFAUT }, demo: true, donnees };
}

/* ================================================== store.js */
/**
 * Persistance. Toute la base tient dans une clé de `localStorage` : une
 * association de cette taille manipule quelques milliers de lignes, très
 * en deçà des 5 Mo du quota, et le prix à payer — aucun serveur, aucun
 * compte, fonctionne hors ligne — est le bon à ce stade.
 *
 * Si le stockage est indisponible (navigation privée, page ouverte depuis
 * un fichier local sur certains navigateurs), l'application continue de
 * fonctionner en mémoire et le dit franchement plutôt que de laisser
 * croire que les saisies sont conservées.
 */




const CLE = 'five-league.base.v1';
const CLE_THEME = 'five-league.theme';

let etatBase = null;
let stockageActif = true;
const abonnes = new Set();

const baseVide = () => ({
  version: 1,
  saison: saisonDuJour(),
  reglages: { ...REGLAGES_DEFAUT },
  demo: false,
  donnees: Object.fromEntries(MODULES.map((m) => [m.id, []])),
});

/** Complète une base lue sur disque : une version antérieure peut ignorer un
 *  module ou un réglage ajouté depuis. */
function normaliser(brute) {
  const propre = baseVide();
  if (!brute || typeof brute !== 'object') return propre;
  propre.reglages = { ...REGLAGES_DEFAUT, ...(brute.reglages || {}) };
  propre.demo = Boolean(brute.demo);
  for (const m of MODULES) {
    const lignes = Array.isArray(brute.donnees?.[m.id]) ? brute.donnees[m.id] : [];
    propre.donnees[m.id] = lignes.filter((l) => l && typeof l === 'object').map((l) => ({ ...l, id: l.id || identifiant(m.id.slice(0, 3)) }));
  }
  propre.saison = brute.saison && saisonsConnues(propre).includes(brute.saison) ? brute.saison : saisonParDefaut(propre);
  return propre;
}

function saisonsConnues(source = etatBase) {
  const vues = new Set(SAISONS);
  for (const m of MODULES) for (const l of source.donnees[m.id]) if (l.saison) vues.add(l.saison);
  return [...vues].sort();
}

/** La saison ouverte par défaut est celle du jour si elle contient des
 *  données, sinon la plus récente qui en contient. */
function saisonParDefaut(source = etatBase) {
  const courante = saisonDuJour();
  const peuplees = new Set();
  for (const m of MODULES) for (const l of source.donnees[m.id]) if (l.saison) peuplees.add(l.saison);
  if (peuplees.has(courante) || !peuplees.size) return courante;
  return [...peuplees].sort().pop();
}

function demarrerBase() {
  let brute = null;
  try {
    const texte = localStorage.getItem(CLE);
    brute = texte ? JSON.parse(texte) : null;
  } catch (e) {
    stockageActif = false;
  }
  if (!brute) {
    etatBase = normaliser(baseDemo(aujourdhui()));
    etatBase.saison = saisonParDefaut();
    ecrire();
  } else {
    etatBase = normaliser(brute);
  }
  return etatBase;
}

function ecrire() {
  if (!stockageActif) return false;
  try {
    localStorage.setItem(CLE, JSON.stringify(etatBase));
    return true;
  } catch (e) {
    stockageActif = false;
    return false;
  }
}

const stockageDisponible = () => stockageActif;
const laBase = () => etatBase;
const reglagesActifs = () => etatBase.reglages;
const estDemo = () => etatBase.demo;
const saisons = () => saisonsConnues();
const saisonActive = () => etatBase.saison;

function abonner(fonction) {
  abonnes.add(fonction);
  return () => abonnes.delete(fonction);
}

function publier() {
  ecrire();
  for (const f of abonnes) f(etatBase);
}

/** Lignes d'un module, filtrées sur la saison ouverte sauf demande contraire. */
function lignes(moduleId, { toutesSaisons = false, saison: choisie } = {}) {
  const brutes = etatBase.donnees[moduleId] || [];
  if (toutesSaisons) return brutes.slice();
  const cible = choisie || etatBase.saison;
  return brutes.filter((l) => (l.saison || etatBase.saison) === cible);
}

function ligneParId(moduleId, id) {
  return (etatBase.donnees[moduleId] || []).find((l) => l.id === id) || null;
}

function ajouterLigne(moduleId, valeurs) {
  const nouvelle = { id: identifiant(moduleId.slice(0, 3)), saison: etatBase.saison, ...valeurs, creeLe: aujourdhui(), majLe: aujourdhui() };
  etatBase.donnees[moduleId].push(nouvelle);
  etatBase.demo = false;
  publier();
  return nouvelle;
}

function modifierLigne(moduleId, id, valeurs) {
  const cible = ligneParId(moduleId, id);
  if (!cible) return null;
  Object.assign(cible, valeurs, { majLe: aujourdhui() });
  publier();
  return cible;
}

function supprimerLigne(moduleId, id) {
  const avant = etatBase.donnees[moduleId].length;
  etatBase.donnees[moduleId] = etatBase.donnees[moduleId].filter((l) => l.id !== id);
  if (etatBase.donnees[moduleId].length !== avant) publier();
  return avant - etatBase.donnees[moduleId].length;
}

function ajouterLignes(moduleId, listeValeurs) {
  for (const valeurs of listeValeurs) {
    etatBase.donnees[moduleId].push({ id: identifiant(moduleId.slice(0, 3)), saison: etatBase.saison, ...valeurs, creeLe: aujourdhui(), majLe: aujourdhui() });
  }
  etatBase.demo = false;
  publier();
  return listeValeurs.length;
}

function definirSaison(valeur) {
  etatBase.saison = valeur;
  publier();
}

function majReglages(patch) {
  Object.assign(etatBase.reglages, patch);
  publier();
}

function reinitialiser({ demo = false } = {}) {
  etatBase = demo ? normaliser(baseDemo(aujourdhui())) : baseVide();
  etatBase.saison = saisonParDefaut();
  publier();
}

/** Restauration d'une sauvegarde. Refuse un fichier qui n'a pas la forme
 *  attendue plutôt que d'écraser la base par du vide. */
function restaurer(texte) {
  const brute = JSON.parse(texte);
  if (!brute || typeof brute !== 'object' || !brute.donnees || typeof brute.donnees !== 'object') {
    throw new Error('Ce fichier n’est pas une sauvegarde Five League.');
  }
  const connus = MODULES.filter((m) => Array.isArray(brute.donnees[m.id]));
  if (!connus.length) throw new Error('Aucun module reconnu dans cette sauvegarde.');
  etatBase = normaliser(brute);
  publier();
  return connus.length;
}

const exporterBase = () => JSON.stringify({ ...etatBase, exporteLe: new Date().toISOString() }, null, 2);

/* -------------------------------------------------------------- Apparence */

function themeEnregistre() {
  try { return localStorage.getItem(CLE_THEME) || 'auto'; } catch (e) { return 'auto'; }
}

function definirTheme(valeur) {
  try { localStorage.setItem(CLE_THEME, valeur); } catch (e) { /* sans stockage, le choix vaut pour la session */ }
  appliquerTheme(valeur);
}

function appliquerTheme(valeur) {
  const racine = document.documentElement;
  if (valeur === 'auto') racine.removeAttribute('data-theme');
  else racine.setAttribute('data-theme', valeur);
}

/* ================================================== stats.js */
/**
 * Agrégats du modèle socio-économique. Chaque module sait calculer sa
 * contribution (`economie`) et ses flux datés (`flux`) ; ce fichier assemble
 * ces réponses en une lecture d'ensemble : d'où vient l'argent, où il part,
 * ce qui reste attendu, et ce qui demande une action cette semaine.
 */




/** Synthèse d'une saison, module par module. */
function synthese(saison = saisonActive()) {
  const r = reglagesActifs();
  const parModule = MODULES.map((m) => {
    const donnees = lignes(m.id, { saison });
    const eco = m.economie ? m.economie(donnees, r) : { produits: 0, charges: 0, attendu: 0, valorisation: 0 };
    return { module: m, lignes: donnees.length, ...eco };
  });
  const total = (cle) => parModule.reduce((t, p) => t + (p[cle] || 0), 0);
  const produits = total('produits');
  const charges = total('charges');
  return {
    saison,
    parModule,
    produits,
    charges,
    resultat: produits - charges,
    attendu: total('attendu'),
    valorisation: total('valorisation'),
    sources: parModule.filter((p) => p.produits > 0).sort((a, b) => b.produits - a.produits),
  };
}

function saisonPrecedente(saison) {
  const a = Number(String(saison).split('-')[0]);
  return `${a - 1}-${a}`;
}

/** Écart de produits avec la saison précédente, en pourcentage. */
function evolutionProduits(saison = saisonActive()) {
  const avant = synthese(saisonPrecedente(saison)).produits;
  const maintenant = synthese(saison).produits;
  if (!avant) return null;
  return { avant, maintenant, ecart: ((maintenant - avant) / avant) * 100 };
}

/** Flux datés d'une saison, agrégés par mois — la boutique n'a pas de date
 *  de vente et n'y figure donc pas (voir docs/architecture.md). */
function fluxMensuels(saison = saisonActive()) {
  const { debut, fin } = bornesSaison(saison);
  const seaux = new Map();
  for (let d = new Date(`${debut}T12:00:00Z`); d.toISOString().slice(0, 10) <= fin; d.setUTCMonth(d.getUTCMonth() + 1)) {
    seaux.set(d.toISOString().slice(0, 7), { cle: d.toISOString().slice(0, 7), produits: 0, charges: 0 });
  }
  for (const m of MODULES) {
    if (!m.flux) continue;
    for (const l of lignes(m.id, { saison })) {
      for (const f of m.flux(l)) {
        if (!f.date || !f.montant) continue;
        const seau = seaux.get(moisDe(f.date));
        if (!seau) continue;
        seau[f.sens === 'charge' ? 'charges' : 'produits'] += f.montant;
      }
    }
  }
  return [...seaux.values()];
}

/** Répartition d'un module par valeur d'un champ (camembert des modules). */
function repartition(moduleId, champ, mesure) {
  const groupes = new Map();
  for (const l of lignes(moduleId)) {
    const cle = l[champ] || '—';
    groupes.set(cle, (groupes.get(cle) || 0) + (mesure ? mesure(l) : 1));
  }
  return [...groupes.entries()].map(([libelle, valeur]) => ({ libelle, valeur })).sort((a, b) => b.valeur - a.valeur);
}

const AJOUT = (liste, alerte) => { if (alerte) liste.push(alerte); };

/**
 * Points d'attention. Les échéances sont cherchées sur toutes les saisons :
 * en juillet, les dates limites qui comptent sont celles de la saison
 * suivante.
 */
function alertes() {
  const liste = [];
  const r = reglagesActifs();

  const impayees = lignes('cotisations').filter((l) => etatCotisation(l) !== 'Payée');
  const enRetard = impayees.filter((l) => l.echeance && joursRestants(l.echeance) < 0);

    });
  }

  for (const l of lignes('subventions', { toutesSaisons: true })) {

    } else if (j >= 0 && j <= 60 && l.statut === 'À déposer') {

    }
  }
  const accordees = lignes('subventions', { toutesSaisons: true }).filter((l) => l.statut === 'Accordée');
  if (accordees.length) {
    AJOUT(liste, { module: 'subventions', gravite: 'basse', titre: `${nombre(accordees.length)} subvention${accordees.length > 1 ? 's' : ''} accordée${accordees.length > 1 ? 's' : ''} non versée${accordees.length > 1 ? 's' : ''}`, detail: `${euros(accordees.reduce((t, l) => t + (Number(l.accorde) || 0), 0))} à recevoir.` });
  }

  const stock = lignes('boutique').filter((l) => etatStock(l) !== 'En stock');
  if (stock.length) {
    AJOUT(liste, {
      module: 'boutique',
      gravite: stock.some((l) => etatStock(l) === 'Rupture') ? 'moyenne' : 'basse',
      titre: `${nombre(stock.length)} article${stock.length > 1 ? 's' : ''} en tension de stock`,
      detail: stock.map((l) => l.produit).slice(0, 3).join(', ') + (stock.length > 3 ? '…' : ''),
    });
  }

  const prochains = lignes('evenements', { toutesSaisons: true })
    .filter((l) => l.date && l.statut !== 'Annulé' && l.statut !== 'Réalisé' && joursRestants(l.date) >= 0 && joursRestants(l.date) <= 30)
    .sort((a, b) => a.date.localeCompare(b.date));
  if (prochains.length) {
    const p = prochains[0];
    AJOUT(liste, { module: 'evenements', gravite: 'basse', titre: `${nombre(prochains.length)} événement${prochains.length > 1 ? 's' : ''} sous 30 jours`, detail: `Prochain : ${p.intitule}, dans ${joursRestants(p.date)} jours à ${p.lieu || 'lieu à confirmer'}.` });
  }

  const facturesDues = lignes('prestations', { toutesSaisons: true }).filter((l) => l.statut === 'Facturée' && l.echeance && joursRestants(l.echeance) < 0);
  if (facturesDues.length) {
    AJOUT(liste, { module: 'prestations', gravite: 'haute', titre: `${nombre(facturesDues.length)} facture${facturesDues.length > 1 ? 's' : ''} échue${facturesDues.length > 1 ? 's' : ''}`, detail: `${euros(facturesDues.reduce((t, l) => t + (Number(l.montant) || 0), 0))} à relancer : ${facturesDues.map((l) => l.client).slice(0, 3).join(', ')}.` });
  }

  const aRenouveler = lignes('partenariats', { toutesSaisons: true }).filter((l) => (l.statut === 'Actif' || l.statut === 'À renouveler') && l.fin && joursRestants(l.fin) <= 90 && joursRestants(l.fin) >= -30);
  if (aRenouveler.length) {
    AJOUT(liste, { module: 'partenariats', gravite: 'moyenne', titre: `${nombre(aRenouveler.length)} partenariat${aRenouveler.length > 1 ? 's' : ''} arrive${aRenouveler.length > 1 ? 'nt' : ''} à échéance`, detail: `${euros(aRenouveler.reduce((t, l) => t + (Number(l.montant) || 0), 0))} de sponsoring à sécuriser avant le ${dateCourte(aRenouveler.map((l) => l.fin).sort()[0])}.` });
  }

  const heuresSaisies = lignes('rh').reduce((t, l) => t + (Number(l.heures) || 0), 0);
  if (lignes('rh').length && !heuresSaisies) {
    AJOUT(liste, { module: 'rh', gravite: 'basse', titre: 'Aucune heure de bénévolat saisie', detail: `Les heures valorisées à ${euros(r.tauxHoraire)} pèsent dans les dossiers de subvention.` });
  }

  const ordre = { haute: 0, moyenne: 1, basse: 2 };
  return liste.sort((a, b) => ordre[a.gravite] - ordre[b.gravite]).map((a) => ({ ...a, moduleObjet: MODULE_PAR_ID[a.module] }));
}

/* ================================================== graphes.js */
/**
 * Graphiques. Du SVG écrit à la main : trois formes suffisent au besoin
 * (anneau, histogramme, barres horizontales), elles se redimensionnent
 * seules par le `viewBox`, s'impriment nettement et suivent le thème sombre
 * parce que les couleurs de texte et de grille viennent des variables CSS.
 *
 * Chaque graphique est doublé d'un résumé textuel pour les lecteurs d'écran :
 * un dessin sans équivalent n'informe personne.
 */



const TAU = Math.PI * 2;

/** Anneau de répartition. Les segments sont dessinés au trait pointillé :
 *  une seule primitive, aucun calcul d'arc, et un rendu net à toute taille. */
function anneau(segments, { titre = 'Répartition', centreValeur, centreLibelle, taille = 240 } = {}) {
  const total = segments.reduce((t, s) => t + s.valeur, 0);
  const rayon = 70;
  const circonference = TAU * rayon;
  let depart = 0;
  const svg = h('svg.graphe-anneau', { viewBox: '0 0 200 200', width: taille, height: taille, role: 'img', 'aria-label': `${titre} : ${segments.map((s) => `${s.libelle} ${pourcent(s.valeur, total)}`).join(', ')}` });
  svg.appendChild(h('circle', { cx: 100, cy: 100, r: rayon, fill: 'none', stroke: 'var(--trait-graphe)', 'stroke-width': 26 }));
  for (const s of segments) {
    if (s.valeur <= 0) continue;
    const part = total ? s.valeur / total : 0;
    const arc = h('circle.anneau-part', {
      cx: 100, cy: 100, r: rayon, fill: 'none', stroke: s.couleur, 'stroke-width': 26,
      'stroke-dasharray': `${(part * circonference).toFixed(2)} ${circonference.toFixed(2)}`,
      'stroke-dashoffset': (-depart * circonference).toFixed(2),
      transform: 'rotate(-90 100 100)',
    });
    arc.appendChild(h('title', { text: `${s.libelle} — ${euros(s.valeur)} (${pourcent(s.valeur, total)})` }));
    svg.appendChild(arc);
    depart += part;
  }
  if (centreValeur !== undefined) {
    svg.appendChild(h('text.anneau-valeur', { x: 100, y: 97, 'text-anchor': 'middle', text: centreValeur }));
    svg.appendChild(h('text.anneau-libelle', { x: 100, y: 116, 'text-anchor': 'middle', text: centreLibelle || '' }));
  }
  return svg;
}

function legende(segments, total) {
  return h('ul.legende', {}, segments.map((s) => h('li.legende-item', {},
    h('span.legende-pastille', { style: { background: s.couleur } }),
    h('span.legende-nom', { text: s.libelle }),
    h('span.legende-valeur', { text: `${euros(s.valeur)}${total ? ` · ${pourcent(s.valeur, total)}` : ''}` }))));
}

/** Échelle « ronde » : on préfère 0 / 2 500 / 5 000 à 0 / 2 317 / 4 634. */
function palier(max) {
  if (max <= 0) return { haut: 100, pas: 25 };
  const vise = max / 5;
  const magnitude = 10 ** Math.floor(Math.log10(vise));
  const pas = [1, 2, 2.5, 5, 10].map((f) => f * magnitude).find((p) => vise <= p) || magnitude * 10;
  return { haut: Math.ceil(max / pas) * pas, pas };
}

/**
 * Histogramme groupé. `series` : [{ libelle, couleur, valeurs: number[] }],
 * `categories` : les étiquettes de l'axe horizontal.
 *
 * Le dessin est refait à la largeur réelle du conteneur plutôt qu'étiré
 * depuis un `viewBox` fixe : une unité SVG vaut un pixel, donc les
 * étiquettes d'axe gardent leur taille lisible sur un téléphone comme sur
 * un écran large, et les barres ne se déforment pas.
 */
function histogramme(config) {
  const cadre = h('div.graphe-cadre');
  let largeurVue = 0;
  const dessiner = () => {
    const largeur = Math.max(300, Math.round(cadre.clientWidth || 720));
    if (largeur === largeurVue) return;
    largeurVue = largeur;
    cadre.replaceChildren(dessinHistogramme({ ...config, largeur }));
  };
  if (typeof ResizeObserver === 'function') new ResizeObserver(dessiner).observe(cadre);
  requestAnimationFrame(dessiner);
  return cadre;
}

function dessinHistogramme({ categories, series, titre = 'Évolution', hauteur = 220, largeur = 720, format = eurosCourt }) {
  const L = largeur;
  const H = hauteur;
  const margeG = 52;
  const margeB = 24;
  const margeH = 10;
  const max = Math.max(0, ...series.flatMap((s) => s.valeurs));
  const { haut, pas } = palier(max);
  const aireH = H - margeB - margeH;
  const largeurCase = (L - margeG) / Math.max(1, categories.length);
  const largeurBarre = Math.max(3, Math.min(18, (largeurCase - 5) / series.length));
  const y = (v) => margeH + aireH - (v / haut) * aireH;
  // Une seule unité sur toute la graduation : mélanger « 2 500 € » et
  // « 13 k€ » sur le même axe oblige le lecteur à convertir de tête.
  const formatAxe = haut >= 10000
    ? (v) => (v === 0 ? '0' : `${(v / 1000).toLocaleString('fr-FR')} k€`)
    : format;
  // Une étiquette sur deux, ou sur trois, quand la place manque.
  const saut = Math.ceil(52 / Math.max(1, largeurCase));

  const svg = h('svg.graphe-barres', { viewBox: `0 0 ${L} ${H}`, width: L, height: H, role: 'img', 'aria-label': `${titre} : ${series.map((s) => `${s.libelle}, total ${format(s.valeurs.reduce((a, b) => a + b, 0))}`).join(' ; ')}` });
  for (let v = 0; v <= haut + 1; v += pas) {
    svg.appendChild(h('line', { x1: margeG - 6, x2: L, y1: y(v), y2: y(v), stroke: 'var(--trait-graphe)', 'stroke-width': 1 }));
    svg.appendChild(h('text.graphe-axe', { x: margeG - 10, y: y(v) + 4, 'text-anchor': 'end', text: formatAxe(v) }));
  }
  categories.forEach((cat, i) => {
    const base = margeG + i * largeurCase + (largeurCase - largeurBarre * series.length) / 2;
    series.forEach((s, j) => {
      const valeur = s.valeurs[i] || 0;
      const hauteurBarre = Math.max(valeur > 0 ? 2 : 0, aireH * (valeur / haut));
      const rect = h('rect.barre', { x: base + j * largeurBarre, y: margeH + aireH - hauteurBarre, width: Math.max(2, largeurBarre - 2), height: hauteurBarre, rx: 2, fill: s.couleur });
      rect.appendChild(h('title', { text: `${cat} — ${s.libelle} : ${format(valeur)}` }));
      svg.appendChild(rect);
    });
    if (i % saut === 0) {
      svg.appendChild(h('text.graphe-axe', { x: margeG + i * largeurCase + largeurCase / 2, y: H - 7, 'text-anchor': 'middle', text: cat }));
    }
  });
  return svg;
}

/** Barres horizontales : pour comparer des catégories nommées. */
function barresHorizontales(entrees, { couleur = 'var(--accent)', format = nombre, hauteurLigne = 30 } = {}) {
  const max = Math.max(1, ...entrees.map((e) => e.valeur));
  return h('ul.barres-h', {}, entrees.map((e) => h('li.barre-h', {},
    h('span.barre-h-nom', { text: e.libelle }),
    h('span.barre-h-piste', {}, h('span.barre-h-remplissage', { style: { width: `${Math.max(2, (e.valeur / max) * 100)}%`, background: e.couleur || couleur } })),
    h('span.barre-h-valeur', { text: format(e.valeur) }))));
}

/** Jauge de progression vers un objectif. */
function jaugeGraphe(part, { couleur = 'var(--accent)' } = {}) {
  const p = Math.max(0, Math.min(1, part || 0));
  return h('span.jauge', { role: 'img', 'aria-label': `${Math.round(p * 100)} %` },
    h('span.jauge-remplissage', { style: { width: `${p * 100}%`, background: couleur } }));
}

/* ================================================== echange.js */
/**
 * Imports et exports.
 *
 * Le CSV est écrit au format que les tableurs français attendent : point-
 * virgule en séparateur, BOM en tête, retours CRLF — sans quoi Excel colle
 * toute la ligne dans la première colonne et casse les accents.
 *
 * Le XLSX est produit ici, sans bibliothèque : un classeur est une archive
 * ZIP de quelques fichiers XML. L'archive est écrite en mode « stocké »
 * (aucune compression), ce qui évite d'embarquer un compresseur pour des
 * fichiers qui pèsent quelques dizaines de kilo-octets.
 */


/* ------------------------------------------------------------------- CSV */

const echapper = (valeur) => {
  const texte = valeur === null || valeur === undefined ? '' : String(valeur);
  return /[";\n\r]/.test(texte) ? `"${texte.replace(/"/g, '""')}"` : texte;
};

function versCSV(entetes, lignes) {
  const corps = [entetes, ...lignes].map((ligne) => ligne.map(echapper).join(';')).join('\r\n');
  return `\ufeff${corps}\r\n`;
}

/** Analyse un CSV en tolérant les deux séparateurs courants et les guillemets. */
function depuisCSV(texte) {
  const propre = texte.replace(/^\ufeff/, '');
  const premiereLigne = propre.split(/\r?\n/)[0] || '';
  const separateur = premiereLigne.split(';').length >= premiereLigne.split(',').length ? ';' : ',';
  const lignes = [];
  let champ = '';
  let ligne = [];
  let entreGuillemets = false;
  for (let i = 0; i < propre.length; i++) {
    const c = propre[i];
    if (entreGuillemets) {
      if (c === '"' && propre[i + 1] === '"') { champ += '"'; i++; }
      else if (c === '"') entreGuillemets = false;
      else champ += c;
      continue;
    }
    if (c === '"') entreGuillemets = true;
    else if (c === separateur) { ligne.push(champ); champ = ''; }
    else if (c === '\n') { ligne.push(champ); lignes.push(ligne); ligne = []; champ = ''; }
    else if (c !== '\r') champ += c;
  }
  if (champ || ligne.length) { ligne.push(champ); lignes.push(ligne); }
  return lignes.filter((l) => l.some((v) => v.trim() !== ''));
}

/* ------------------------------------------------------------------- ZIP */

const TABLE_CRC = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[i] = c >>> 0;
  }
  return table;
})();

function crc32(octets) {
  let c = 0xffffffff;
  for (let i = 0; i < octets.length; i++) c = TABLE_CRC[(c ^ octets[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

/** Archive ZIP sans compression : en-tête local, données, annuaire central. */
function archiveZip(fichiers) {
  const encodeur = new TextEncoder();
  const maintenant = new Date();
  const heureDos = (maintenant.getHours() << 11) | (maintenant.getMinutes() << 5) | (maintenant.getSeconds() >> 1);
  const dateDos = ((maintenant.getFullYear() - 1980) << 9) | ((maintenant.getMonth() + 1) << 5) | maintenant.getDate();
  const entrees = fichiers.map((f) => ({ nom: encodeur.encode(f.nom), donnees: encodeur.encode(f.contenu) }));
  const tailleTotale = entrees.reduce((t, e) => t + 30 + e.nom.length + e.donnees.length + 46 + e.nom.length, 0) + 22;
  const tampon = new Uint8Array(tailleTotale);
  const vue = new DataView(tampon.buffer);
  let position = 0;
  const ecrire32 = (v) => { vue.setUint32(position, v, true); position += 4; };
  const ecrire16 = (v) => { vue.setUint16(position, v, true); position += 2; };
  const ecrireOctets = (o) => { tampon.set(o, position); position += o.length; };

  for (const e of entrees) {
    e.decalage = position;
    e.crc = crc32(e.donnees);
    ecrire32(0x04034b50); ecrire16(20); ecrire16(0x0800); ecrire16(0);
    ecrire16(heureDos); ecrire16(dateDos);
    ecrire32(e.crc); ecrire32(e.donnees.length); ecrire32(e.donnees.length);
    ecrire16(e.nom.length); ecrire16(0);
    ecrireOctets(e.nom); ecrireOctets(e.donnees);
  }
  const debutAnnuaire = position;
  for (const e of entrees) {
    ecrire32(0x02014b50); ecrire16(20); ecrire16(20); ecrire16(0x0800); ecrire16(0);
    ecrire16(heureDos); ecrire16(dateDos);
    ecrire32(e.crc); ecrire32(e.donnees.length); ecrire32(e.donnees.length);
    ecrire16(e.nom.length); ecrire16(0); ecrire16(0); ecrire16(0); ecrire16(0);
    ecrire32(0); ecrire32(e.decalage);
    ecrireOctets(e.nom);
  }
  const tailleAnnuaire = position - debutAnnuaire;
  ecrire32(0x06054b50); ecrire16(0); ecrire16(0);
  ecrire16(entrees.length); ecrire16(entrees.length);
  ecrire32(tailleAnnuaire); ecrire32(debutAnnuaire); ecrire16(0);
  return new Blob([tampon.subarray(0, position)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ------------------------------------------------------------------ XLSX */

const ENTITES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
const xmlSafe = (v) => String(v === null || v === undefined ? '' : v)
  .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '')
  .replace(/[&<>"]/g, (c) => ENTITES[c]);

function colonne(index) {
  let nom = '';
  let n = index;
  do { nom = String.fromCharCode(65 + (n % 26)) + nom; n = Math.floor(n / 26) - 1; } while (n >= 0);
  return nom;
}

const nomFeuille = (nom) => (nom || 'Feuille').replace(/[\\/*?:[\]]/g, ' ').slice(0, 31);

function feuilleXML(entetes, lignes) {
  const rangee = (cellules, numero) => `<row r="${numero}">${cellules.map((valeur, i) => {
    const ref = `${colonne(i)}${numero}`;
    if (typeof valeur === 'number' && Number.isFinite(valeur)) return `<c r="${ref}"><v>${valeur}</v></c>`;
    const texte = xmlSafe(valeur);
    return texte === '' ? `<c r="${ref}"/>` : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${texte}</t></is></c>`;
  }).join('')}</row>`;
  const corps = [rangee(entetes, 1), ...lignes.map((l, i) => rangee(l, i + 2))].join('');
  const largeurs = entetes.map((e, i) => `<col min="${i + 1}" max="${i + 1}" width="${Math.min(38, Math.max(12, String(e).length + 4))}" customWidth="1"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${largeurs}</cols><sheetData>${corps}</sheetData></worksheet>`;
}

/** Classeur multi-feuilles. `feuilles` : [{ nom, entetes, lignes }]. */
function versXLSX(feuilles) {
  const utiles = feuilles.filter((f) => f.entetes && f.entetes.length);
  const types = ['<Default Extension="xml" ContentType="application/xml"/>',
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>',
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>',
    ...utiles.map((f, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`)].join('');
  const fichiers = [
    { nom: '[Content_Types].xml', contenu: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">${types}</Types>` },
    { nom: '_rels/.rels', contenu: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { nom: 'xl/workbook.xml', contenu: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${utiles.map((f, i) => `<sheet name="${xmlSafe(nomFeuille(f.nom))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
    { nom: 'xl/_rels/workbook.xml.rels', contenu: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${utiles.map((f, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}</Relationships>` },
    ...utiles.map((f, i) => ({ nom: `xl/worksheets/sheet${i + 1}.xml`, contenu: feuilleXML(f.entetes, f.lignes) })),
  ];
  return archiveZip(fichiers);
}

/* ---------------------------------------------------- Tables d'un module */

/** Entêtes et lignes d'un module, prêtes pour le CSV comme pour le XLSX. */
function tableModule(module, lignes, reglages) {
  const champs = CHAMPS_TOUS(module);
  const entetes = champs.map((c) => c.libelle);
  const corps = lignes.map((l) => champs.map((c) => {
    const valeur = c.calcul ? c.calcul(l, reglages) : l[c.id];
    if (['montant', 'nombre', 'heures'].includes(c.type)) return Number(valeur) || 0;
    return valeur === null || valeur === undefined ? '' : valeur;
  }));
  return { nom: module.titre, entetes, lignes: corps, champs };
}

/* -------------------------------------------------------------- Livraison */

function telecharger(nomFichier, contenu, type = 'text/plain;charset=utf-8') {
  const blob = contenu instanceof Blob ? contenu : new Blob([contenu], { type });
  const url = URL.createObjectURL(blob);
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = nomFichier;
  document.body.appendChild(lien);
  lien.click();
  lien.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function copier(texte) {
  try {
    await navigator.clipboard.writeText(texte);
    return true;
  } catch (e) {
    return false;
  }
}

const nomHorodate = (base, extension) => `${base}-${new Date().toISOString().slice(0, 10)}.${extension}`;

/* ------------------------------------------------------------ Import CSV */

const plier = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

/** Rapproche les entêtes d'un fichier importé des champs du module. */
function correspondance(module, entetes) {
  return entetes.map((entete) => {
    const cible = plier(entete);
    const trouve = module.champs.find((c) => plier(c.libelle) === cible) || module.champs.find((c) => plier(c.id) === cible);
    return trouve ? trouve.id : null;
  });
}

/** Convertit une ligne de fichier en enregistrement, selon la correspondance. */
function ligneImportee(module, colonnes, valeurs) {
  const ligne = {};
  colonnes.forEach((champId, i) => {
    if (!champId) return;
    const champ = champParId(module, champId);
    const brut = String(valeurs[i] === undefined ? '' : valeurs[i]).trim();
    if (!champ || brut === '') return;
    if (['montant', 'nombre', 'heures'].includes(champ.type)) {
      const n = Number(brut.replace(/[\s\u20ac]/g, '').replace(',', '.'));
      ligne[champId] = Number.isFinite(n) ? n : 0;
    } else if (champ.type === 'date') {
      const fr = brut.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/);
      ligne[champId] = fr ? `${fr[3]}-${fr[2].padStart(2, '0')}-${fr[1].padStart(2, '0')}` : brut;
    } else {
      ligne[champId] = brut;
    }
  });
  return ligne;
}

/* ================================================== vue-module.js */
/**
 * Page d'un module. Une seule vue sert les sept domaines : tout ce qui les
 * distingue — champs, colonnes, indicateurs, états — vient du schéma. Une
 * page par module aurait signifié sept formulaires à corriger à chaque
 * évolution.
 */








/** L'état de tri et de filtre survit à la navigation, le temps de la session. */
const etats = new Map();
const etatDe = (id) => {
  if (!etats.has(id)) etats.set(id, { recherche: '', filtre: '', tri: null, sens: 1, toutesSaisons: false });
  return etats.get(id);
};

const valeurAffichee = (ligne, champ, reglages) => {
  const brute = champ.calcul ? champ.calcul(ligne, reglages) : ligne[champ.id];
  switch (champ.type) {
    case 'montant': return euros(brute);
    case 'nombre': return nombre(brute);
    case 'heures': return heures(brute);
    case 'date': return dateCourte(brute);
    default: return brute === undefined || brute === null || brute === '' ? '—' : String(brute);
  }
};

const valeurTri = (ligne, champ, reglages) => (champ.calcul ? champ.calcul(ligne, reglages) : ligne[champ.id]);

/* ------------------------------------------------------------ Formulaire */

function champFormulaire(champ, valeur) {
  const identifiantChamp = `champ-${champ.id}`;
  let saisie;
  if (champ.type === 'liste') {
    saisie = h('select.saisie', { id: identifiantChamp, name: champ.id },
      champ.requis ? null : h('option', { value: '', text: '—' }),
      champ.options.map((o) => h('option', { value: o, text: o, selected: String(valeur) === o })));
  } else if (champ.type === 'zone') {
    saisie = h('textarea.saisie', { id: identifiantChamp, name: champ.id, rows: 3, value: valeur ?? '' });
  } else {
    const types = { montant: 'number', nombre: 'number', heures: 'number', date: 'date', courriel: 'email', tel: 'tel' };
    saisie = h('input.saisie', {
      id: identifiantChamp, name: champ.id, type: types[champ.type] || 'text',
      value: valeur ?? '',
      step: champ.type === 'montant' ? '0.01' : champ.type === 'nombre' || champ.type === 'heures' ? '1' : null,
      min: ['montant', 'nombre', 'heures'].includes(champ.type) ? '0' : null,
      inputmode: ['montant', 'nombre', 'heures'].includes(champ.type) ? 'decimal' : null,
    });
  }
  if (champ.requis) saisie.setAttribute('required', '');
  return h(`div.champ${champ.type === 'zone' ? '.champ--large' : ''}`, {},
    h('label.champ-libelle', { for: identifiantChamp }, champ.libelle, champ.requis ? h('span.requis', { text: ' *', 'aria-hidden': 'true' }) : null),
    saisie,
    champ.aide ? h('p.champ-aide', { id: `${identifiantChamp}-aide`, text: champ.aide }) : null);
}

function ouvrirFormulaire(module, ligneExistante) {
  const edition = Boolean(ligneExistante);
  const valeurs = ligneExistante || Object.fromEntries(module.champs.filter((c) => c.defaut !== undefined).map((c) => [c.id, c.defaut]));
  if (!edition) valeurs.saison = valeurs.saison || saisonActive();
  const formulaire = h('form.formulaire', { id: 'formulaire-module', novalidate: true },
    h('div.grille-champs', {}, module.champs.map((c) => champFormulaire(c, valeurs[c.id]))));

  const enregistrer = (fermer) => {
    const donnees = {};
    for (const champ of module.champs) {
      const saisie = formulaire.elements[champ.id];
      let valeur = saisie ? saisie.value : '';
      if (['montant', 'nombre', 'heures'].includes(champ.type)) valeur = valeur === '' ? 0 : Number(valeur);
      donnees[champ.id] = valeur;
      if (champ.requis && (valeur === '' || valeur === null || (typeof valeur === 'number' && Number.isNaN(valeur)))) {
        saisie.focus();
        saisie.setAttribute('aria-invalid', 'true');
        toast(`${champ.libelle} : ce champ est obligatoire.`, 'erreur');
        return;
      }
    }
    if (edition) modifierLigne(module.id, ligneExistante.id, donnees);
    else ajouterLigne(module.id, donnees);
    fermer();
    toast(edition ? 'Modification enregistrée.' : `${module.singulier.charAt(0).toUpperCase()}${module.singulier.slice(1)} ajouté${module.singulier.endsWith('e') ? 'e' : ''}.`);
  };

  const { boite } = modale({
    titre: edition ? `Modifier — ${ligneExistante[module.champCle] || module.singulier}` : `Nouvel élément — ${module.titre}`,
    corps: formulaire,
    large: true,
    actions: [
      { libelle: 'Annuler' },
      { libelle: 'Enregistrer', variante: 'primaire', action: enregistrer },
    ],
  });
  formulaire.addEventListener('submit', (e) => { e.preventDefault(); });
  boite.style.setProperty('--accent-module', module.couleur);
}

/* ---------------------------------------------------------------- Tableau */

function tableau(module, lignes, etat, reglages) {
  const colonnes = module.colonnes.map((id) => champParId(module, id)).filter(Boolean);
  const tri = etat.tri ? champParId(module, etat.tri) : null;
  const triees = lignes.slice();
  if (tri) triees.sort((a, b) => comparer(valeurTri(a, tri, reglages), valeurTri(b, tri, reglages), tri.type) * etat.sens);

  const enTete = h('tr', {}, colonnes.map((c) => {
    const actif = etat.tri === c.id;
    return h('th', { scope: 'col', class: ['montant', 'nombre', 'heures'].includes(c.type) ? 'aligne-droite' : '', 'aria-sort': actif ? (etat.sens === 1 ? 'ascending' : 'descending') : 'none' },
      h('button.tri', {
        type: 'button',
        onclick: () => {
          if (etat.tri === c.id) etat.sens = -etat.sens;
          else { etat.tri = c.id; etat.sens = 1; }
          rafraichir(module.id);
        },
      }, h('span', { text: c.libelle }), actif ? h('span.tri-fleche', { text: etat.sens === 1 ? '▲' : '▼' }) : null));
  }).concat([h('th.colonne-actions', { scope: 'col' }, h('span.visuellement-cache', { text: 'Actions' }))]));

  const corps = triees.map((ligne) => h('tr', {}, [
    ...colonnes.map((c) => {
      const cellule = h('td', { 'data-libelle': c.libelle, class: ['montant', 'nombre', 'heures'].includes(c.type) ? 'aligne-droite' : '' });
      if (c.type === 'etat') cellule.appendChild(pastille(c.calcul(ligne)));
      else if (c.id === module.champCle) cellule.appendChild(h('span.cellule-cle', { text: valeurAffichee(ligne, c, reglages) }));
      else cellule.textContent = valeurAffichee(ligne, c, reglages);
      return cellule;
    }),
    h('td.colonne-actions', {},
      h('button.bouton-icone', { type: 'button', title: 'Modifier', 'aria-label': `Modifier ${ligne[module.champCle] || ''}`, onclick: () => ouvrirFormulaire(module, ligne) }, icone(TRACE_ICONES.crayon, 18)),
      h('button.bouton-icone.bouton-icone--danger', {
        type: 'button', title: 'Supprimer', 'aria-label': `Supprimer ${ligne[module.champCle] || ''}`,
        onclick: async () => {
          if (await confirmer(`Supprimer « ${ligne[module.champCle] || module.singulier} » ?`, 'La ligne sera retirée définitivement de la base.')) {
            supprimerLigne(module.id, ligne.id);
            toast('Ligne supprimée.', 'neutre');
          }
        },
      }, icone(TRACE_ICONES.poubelle, 18))),
  ]));

  return h('div.tableau-cadre', {}, h('table.tableau', {},
    h('caption.visuellement-cache', { text: `${module.titre} — ${lignes.length} ${module.pluriel}` }),
    h('thead', {}, enTete),
    h('tbody', {}, corps)));
}

/* ----------------------------------------------------------------- Export */

function menuExport(module, lignes, reglages) {
  const table = tableModule(module, lignes, reglages);

  modale({

        bouton('Classeur Excel (.xlsx)', { variante: 'primaire', icone: TRACE_ICONES.exporter, onclick: () => telecharger(nomHorodate(nom, 'xlsx'), versXLSX([table])) }),
        bouton('Tableur CSV (.csv)', { icone: TRACE_ICONES.exporter, onclick: () => telecharger(nomHorodate(nom, 'csv'), csv, 'text/csv;charset=utf-8') }),
